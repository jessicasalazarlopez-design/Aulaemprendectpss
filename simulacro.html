<script type="application/json" id="bank">{"questions": [{"id": 1, "area": 0, "topic": "Diseño de instrumentos", "type": "select", "context": "Una pregunta de la encuesta dice: «¿Qué tanto le gusta nuestra excelente propuesta de entregas rápidas y baratas?».", "prompt": "¿Cuál es el principal problema de la pregunta y su corrección?", "options": ["Es una pregunta abierta; debe convertirse en opciones cerradas para poder calcular porcentajes con facilidad.", "Induce la respuesta con adjetivos favorables y mezcla dos ideas; debe redactarse de forma neutral y con una idea por pregunta.", "Es demasiado breve; debe agregar contexto sobre la empresa y su trayectoria para que la persona responda mejor.", "No pregunta por la competencia; debe incluir los precios de otros negocios para poder comparar los resultados."], "answer": "1", "explanation": "Un buen instrumento usa lenguaje neutral y una sola idea por pregunta; si induce la respuesta, los datos no sirven para decidir."}, {"id": 2, "area": 0, "topic": "Espíritu emprendedor", "type": "fill", "context": "Una estudiante rediseña por su cuenta el sistema de préstamo de calculadoras de su colegio. No abre ningún negocio.", "prompt": "Complete: la actitud de iniciativa que muestra se llama espíritu ________. Escriba una palabra.", "answer": "emprendedor", "accepted": ["emprendedor", "emprendedora"], "explanation": "El espíritu emprendedor es una actitud de iniciativa y de deseo de mejorar; no depende de abrir una empresa."}, {"id": 3, "area": 0, "topic": "Matriz ponderada", "type": "fill", "context": "Una idea recibe calificaciones de 5 en demanda, 2 en costo inicial y 4 en conocimiento del equipo. Los pesos son 4, 3 y 3, respectivamente.", "prompt": "Calcule el puntaje ponderado total de la idea. Escriba solo el número.", "answer": "38", "accepted": ["38"], "explanation": "5×4 + 2×3 + 4×3 = 20 + 6 + 12 = 38 puntos."}, {"id": 4, "area": 0, "topic": "Selección de ideas (matriz ponderada)", "type": "select", "context": "Un equipo evalúa tres ideas con una matriz. Pesos: demanda 5, costo inicial 3, conocimiento del equipo 2. Calificaciones de 1 a 5 (demanda, costo, conocimiento): idea A (4, 2, 5); idea B (5, 3, 2); idea C (3, 4, 4).", "prompt": "¿Cuál idea debe elegirse y por qué?", "options": ["La A, porque tiene la calificación individual más alta en conocimiento del equipo.", "La C, porque es la más equilibrada y no tiene ninguna calificación baja en demanda.", "La A o la C, porque suman 11 puntos sin ponderar, más que la B, que suma 10.", "La B, con 38 puntos ponderados, porque es la que mejor cumple los criterios de mayor peso."], "answer": "3", "explanation": "Ponderado: A = 4×5+2×3+5×2 = 36; B = 5×5+3×3+2×2 = 38; C = 3×5+4×3+4×2 = 35. Sumar sin ponderar ignora la importancia que el equipo dio a cada criterio."}, {"id": 5, "area": 0, "topic": "Reducción porcentual", "type": "fill", "context": "Un restaurante consumía 1 500 litros de agua por día. Tras instalar grifos eficientes y cambiar sus procesos de lavado, consume 1 140 litros.", "prompt": "¿En qué porcentaje redujo su consumo? Escriba solo el número.", "answer": "24", "accepted": ["24"], "explanation": "(1 500 − 1 140) ÷ 1 500 × 100 = 360 ÷ 1 500 × 100 = 24 %."}, {"id": 6, "area": 0, "topic": "Fuentes de financiamiento", "type": "select", "context": "Un proyecto necesita ₡6 000 000. La dueña aporta ₡1 500 000 de ahorros, el banco le presta ₡3 000 000 y un socio inversionista pone ₡1 500 000 a cambio del 20 % de la empresa.", "prompt": "¿Cuál afirmación es correcta?", "options": ["El financiamiento es propio, porque el dinero del banco y del socio pasa a ser del negocio una vez depositado.", "El financiamiento es mixto: el préstamo se devuelve con intereses y el socio recibe parte de la propiedad y de las decisiones.", "El financiamiento es mixto, pero el préstamo cede parte de la propiedad y el socio debe recibir intereses fijos.", "El financiamiento es mixto; ni el préstamo ni el aporte del socio afectan la propiedad, porque la dueña conserva el control."], "answer": "1", "explanation": "Los ahorros son recursos propios; el préstamo y el socio son externos. El préstamo se paga con intereses sin ceder propiedad; el socio recibe una parte de la empresa."}, {"id": 7, "area": 0, "topic": "Técnicas creativas", "type": "select", "context": "En una lluvia de ideas de ocho personas, la jefa critica cada propuesta apenas se dice y casi nadie vuelve a aportar.", "prompt": "¿Qué ajuste respeta mejor la técnica?", "options": ["Separar la etapa de generar cantidad sin críticas de la etapa de evaluar con criterios definidos.", "Limitar a tres ideas por persona para que las críticas sean más precisas y se descarte desde el inicio.", "Pedir a la jefa que seleccione las ideas antes de empezar, para que el grupo no pierda tiempo.", "Reemplazar la técnica por una votación inmediata que permita evaluar rápidamente cada propuesta."], "answer": "0", "explanation": "La lluvia de ideas busca cantidad sin juzgar; evaluar viene después, con criterios. Criticar de inmediato inhibe la participación."}, {"id": 8, "area": 0, "topic": "Interpretar resultados", "type": "tf", "context": "En un colegio con 800 estudiantes se encuestó a 80, y 52 señalaron el horario como principal barrera para comprar.", "prompt": "Con ese resultado se puede afirmar que el 65 % de todos los estudiantes del cantón enfrenta esa barrera.", "options": ["Verdadero", "Falso"], "answer": "1", "explanation": "El 65 % describe a las 80 personas encuestadas. Para generalizar a todo el cantón se necesitaría una muestra representativa de ese universo."}, {"id": 9, "area": 0, "topic": "Evidencia de demanda", "type": "select", "context": "Un equipo tiene tres tipos de evidencia: A) 200 «me gusta» en una publicación; B) 35 de 60 personas encuestadas dicen que «probablemente» comprarían; C) 18 personas pagaron un adelanto en una preventa.", "prompt": "¿Cuál evidencia respalda mejor la existencia de demanda?", "options": ["La A, porque es la cifra mayor y proviene de personas reales interesadas en el producto.", "La B, porque supera la mitad de la muestra y la intención de compra es clara.", "Ninguna aporta evidencia, ya que todas provienen de muestras pequeñas y no del mercado completo.", "La C, porque muestra compras reales aunque la muestra sea pequeña."], "answer": "3", "explanation": "La conducta real (pagar) pesa más que las opiniones o las intenciones declaradas; los «me gusta» y las respuestas «probablemente» son evidencia débil."}, {"id": 10, "area": 0, "topic": "Dimensiones del desarrollo sostenible", "type": "select", "context": "Una cooperativa de turismo rural obtiene ganancias estables y paga salarios justos, pero vierte aguas residuales sin tratamiento a un río que usa la comunidad.", "prompt": "¿Cuál afirmación es correcta?", "options": ["Cumple lo económico y lo social, pero debe corregir lo ambiental para ser sostenible.", "Es sostenible, porque dos de las tres dimensiones bastan para asegurar su permanencia.", "No es sostenible, porque la dimensión económica debe estar siempre por encima de las demás.", "Cumple lo social y lo ambiental, pero debe aumentar sus ganancias para ser sostenible."], "answer": "0", "explanation": "El desarrollo sostenible exige integrar las tres dimensiones (social, económica y ambiental); fallar en una compromete a las generaciones futuras."}, {"id": 11, "area": 0, "topic": "Creatividad e innovación", "type": "tf", "context": "Un grupo de estudiantes diseñó un envase muy original que nunca fabricó ni probó con clientes.", "prompt": "Mientras el diseño sea original, ya puede considerarse una innovación.", "options": ["Verdadero", "Falso"], "answer": "1", "explanation": "Una idea creativa se vuelve innovación cuando se aplica y genera valor. Sin prueba ni uso real, sigue siendo una idea."}, {"id": 12, "area": 0, "topic": "Financiamiento propio", "type": "fill", "context": "Un proyecto requiere una inversión total de ₡6 000 000. La persona emprendedora aporta ₡1 500 000 de sus ahorros y el resto es financiamiento externo.", "prompt": "¿Qué porcentaje de la inversión total es financiamiento propio? Escriba solo el número.", "answer": "25", "accepted": ["25"], "explanation": "1 500 000 ÷ 6 000 000 × 100 = 25 %. El resto (75 %) es financiamiento externo."}, {"id": 13, "area": 0, "topic": "Herramientas de recolección", "type": "select", "context": "Una heladería nota que sus clientes habituales visitan el local menos que antes. Cuenta con los registros de ventas por mes, pero quiere entender por qué.", "prompt": "¿Qué combinación de herramientas aporta mejor la explicación?", "options": ["Una encuesta de una sola pregunta a todos los clientes sobre si volverán a comprar el próximo mes.", "Entrevistas a clientes que dejaron de visitarla y observación del local en las horas de mayor afluencia.", "Datos del censo sobre la población del cantón para estimar cuántas personas nuevas podrían comprar.", "Comparar sus ventas mensuales de los últimos años con las de otras heladerías del país."], "answer": "1", "explanation": "Los datos de ventas dicen cuánto cambió; para entender por qué se necesitan técnicas que exploren motivos y conductas, como entrevistas y observación."}, {"id": 14, "area": 0, "topic": "Tipos de innovación", "type": "select", "context": "Una panadería compra un horno que reduce a la mitad el tiempo de horneado y el gasto de gas. El pan que vende es exactamente el mismo.", "prompt": "¿Qué tipo de innovación predomina?", "options": ["De proceso, porque cambia cómo se produce sin modificar el producto.", "De producto, porque el pan se hornea de otra manera y llega más caliente a los clientes.", "De organización, porque los horarios del personal cambian al hornear más rápido.", "Disruptiva, porque reduce costos y puede desplazar a las panaderías competidoras."], "answer": "0", "explanation": "Cambiar cómo se produce o entrega es innovación de proceso. «Disruptiva» clasifica el grado del cambio, no el tipo, y aquí no se crea un mercado nuevo."}, {"id": 15, "area": 0, "topic": "Clientes potenciales", "type": "fill", "context": "Un barrio tiene 1 200 hogares. En una encuesta representativa, el 35 % de los hogares dice que contrataría un servicio de lavandería a domicilio y que pagaría el precio propuesto.", "prompt": "¿Cuántos hogares del barrio serían clientes potenciales? Escriba solo el número.", "answer": "420", "accepted": ["420"], "explanation": "1 200 × 0,35 = 420 hogares. Es una estimación de clientes potenciales, no de ventas aseguradas."}, {"id": 16, "area": 0, "topic": "Análisis del entorno (PESTEL)", "type": "select", "context": "Una empresa de transporte escolar observa tres cambios: a) el combustible sube 15 %; b) una reforma de ley obliga a revisiones técnicas más frecuentes; c) aparecen aplicaciones para rastrear el bus en tiempo real.", "prompt": "¿Qué factor PESTEL corresponde a cada cambio, en ese orden?", "options": ["a) político; b) legal; c) social.", "a) económico; b) político; c) tecnológico.", "a) ecológico; b) legal; c) social.", "a) económico; b) legal; c) tecnológico."], "answer": "3", "explanation": "El precio del combustible es económico; una reforma que cambia obligaciones es legal; una aplicación nueva es tecnológica."}, {"id": 17, "area": 0, "topic": "Habilidades y responsabilidades", "type": "select", "context": "En un equipo de empresa de práctica, Luis cierra acuerdos de precio con los proveedores, Ana mantiene la motivación del grupo cuando las primeras ventas fracasan y Kevin cumple cada entrega pactada con sus clientes.", "prompt": "¿Qué clasificación corresponde a lo que hace cada persona?", "options": ["Luis: característica (negociar); Ana: habilidad (perseverancia); Kevin: responsabilidad (cumplir compromisos).", "Luis: habilidad (negociar); Ana: responsabilidad (perseverancia); Kevin: característica (cumplir compromisos).", "Luis: habilidad (negociar); Ana: característica (perseverancia); Kevin: responsabilidad (cumplir compromisos).", "Luis: responsabilidad (negociar); Ana: característica (perseverancia); Kevin: habilidad (cumplir compromisos)."], "answer": "2", "explanation": "Negociar es un saber hacer (habilidad); la perseverancia es un rasgo (característica); cumplir lo pactado es un deber frente a terceros (responsabilidad)."}, {"id": 18, "area": 0, "topic": "Innovación disruptiva", "type": "fill", "context": "Una plataforma crea un mercado completamente nuevo y desplaza a las empresas que antes lideraban el sector.", "prompt": "Complete: este tipo de cambio se llama innovación ________. Escriba una palabra.", "answer": "disruptiva", "accepted": ["disruptiva", "disruptivo"], "explanation": "La innovación disruptiva crea un nuevo mercado o desplaza a las empresas líderes; es una clasificación según el grado del cambio."}, {"id": 19, "area": 0, "topic": "Interpretación de resultados", "type": "fill", "context": "En una consulta a 80 personas, 52 señalan que el horario es la principal barrera para comprar.", "prompt": "¿Qué porcentaje de las personas consultadas representa? Escriba solo el número, sin el signo %.", "answer": "65", "accepted": ["65"], "explanation": "52 ÷ 80 × 100 = 65 %. Este resultado describe la consulta realizada, no necesariamente todo el mercado."}, {"id": 20, "area": 0, "topic": "Justificación del proyecto", "type": "select", "context": "Un equipo quiere ofrecer tutorías de Matemática. Debe redactar la justificación de su proyecto.", "prompt": "¿Qué enunciado constituye la justificación más sólida?", "options": ["El equipo domina Matemática, dispone de tiempo libre en las tardes y cuenta con un aula prestada por el colegio.", "Las tutorías virtuales crecen en redes sociales y varias personas influyentes las promocionan con buenos resultados.", "El servicio puede cobrarse por hora, requiere poca inversión y tiene bajos costos de operación para el equipo.", "En el colegio, 4 de cada 10 estudiantes de undécimo reprobaron Matemática y el cantón no ofrece tutorías accesibles."], "answer": "3", "explanation": "Una justificación explica el problema, a quién afecta y por qué hace falta la solución; los recursos del equipo o las ventajas del negocio no la sustituyen."}, {"id": 21, "area": 0, "topic": "Pensamiento divergente y convergente", "type": "select", "context": "Un equipo anota 30 posibles usos para los residuos de café y luego, con una matriz, selecciona tres para probarlos.", "prompt": "¿Qué tipo de pensamiento predomina en cada fase?", "options": ["Convergente al anotar los usos, porque parte de un problema; divergente al seleccionar.", "Divergente en ambas fases, porque siempre busca nuevas opciones para el problema.", "Divergente al anotar los usos; convergente al seleccionar y mejorar los tres.", "Convergente en ambas fases, porque la meta final es tomar una decisión concreta."], "answer": "2", "explanation": "El pensamiento divergente genera muchas opciones; el convergente las analiza, selecciona y mejora."}, {"id": 22, "area": 0, "topic": "Espíritu emprendedor", "type": "select", "context": "Mariana trabaja en una ferretería. Nota que se pierde mucho tiempo buscando productos, propone organizar la bodega por colores, convence a su jefatura, prueba el cambio en un pasillo y mide cuánto baja el tiempo de búsqueda. No abre ninguna empresa.", "prompt": "¿Qué interpretación describe mejor su conducta?", "options": ["Muestra emprendimiento empresarial: toda mejora que genera ahorro en un negocio ajeno equivale a crear una empresa propia.", "Muestra espíritu emprendedor: detecta un problema, actúa por iniciativa y comprueba el resultado, aunque siga siendo empleada.", "Muestra una habilidad técnica, no iniciativa, porque su propuesta solo pudo aplicarse con la autorización de la jefatura.", "Muestra cultura emprendedora del negocio, porque el espíritu emprendedor solo aparece cuando la empresa lo promueve."], "answer": "1", "explanation": "El espíritu emprendedor es una actitud de iniciativa y mejora; no exige abrir una empresa ni desaparece porque la jefatura deba autorizar el cambio."}, {"id": 23, "area": 0, "topic": "Proyecto de vida", "type": "select", "context": "Andrés cursa undécimo año en electrónica, quiere ingresar a la universidad y desea ganar dinero reparando equipos. Dispone de unas seis horas libres por semana.", "prompt": "¿Qué decisión articula mejor su emprendimiento con su proyecto de vida?", "options": ["Empezar con un servicio de pocas horas semanales, fijar metas por etapas y revisar cada semestre si sostiene sus estudios.", "Dedicarse a tiempo completo al negocio y aplazar sus estudios hasta confirmar que la idea es rentable.", "Posponer el emprendimiento hasta terminar la carrera para evitar riesgos y concentrarse en un solo objetivo.", "Comprar de una vez todo el equipo con sus ahorros y ajustar su horario después según la demanda que llegue."], "answer": "0", "explanation": "Emprender puede ser un medio para el proyecto de vida si se planifica con metas realistas y se revisa el camino, sin sacrificar las demás metas personales."}, {"id": 24, "area": 0, "topic": "Análisis FODA", "type": "select", "context": "Una idea de servicio tiene una demanda en crecimiento en la zona, pero el equipo no tiene conocimientos técnicos para prestarlo.", "prompt": "¿Cómo se clasifican esos dos elementos y qué decisión es coherente?", "options": ["Demanda en crecimiento: fortaleza; falta de conocimientos: amenaza; conviene descartar la idea de inmediato.", "Demanda en crecimiento: oportunidad; falta de conocimientos: amenaza; conviene esperar a que el mercado cambie.", "Demanda en crecimiento: fortaleza; falta de conocimientos: debilidad; conviene avanzar y aprender sobre la marcha.", "Demanda: oportunidad (externa); falta de conocimientos: debilidad (interna); conviene capacitarse o buscar un aliado."], "answer": "3", "explanation": "Fortalezas y debilidades son internas del equipo; oportunidades y amenazas vienen del entorno. Una debilidad se atiende (capacitación, alianzas) antes de aprovechar la oportunidad."}, {"id": 25, "area": 0, "topic": "Cultura emprendedora", "type": "tf", "context": "Un colegio quiere desarrollar una cultura emprendedora entre su estudiantado.", "prompt": "Para fortalecerla, conviene sancionar a los equipos cuyas ideas fracasan, de manera que los demás eviten riesgos innecesarios.", "options": ["Verdadero", "Falso"], "answer": "1", "explanation": "Una cultura emprendedora acepta que equivocarse es parte de aprender; sancionar el error frena la iniciativa y la creatividad."}, {"id": 26, "area": 0, "topic": "Análisis integral", "type": "select", "context": "Un grupo planea un carrito de comidas. Comprobó demanda con 120 encuestas y calculó un margen atractivo. Descubre que la municipalidad no permite ventas ambulantes en la zona elegida y que el aceite usado no tiene gestor autorizado.", "prompt": "¿Qué decisión refleja un análisis integral?", "options": ["Mantener la idea, pero ajustar ubicación y plan de residuos antes de invertir: el mercado no sustituye lo legal ni lo ambiental.", "Continuar, porque la demanda y el margen demuestran viabilidad y los permisos pueden tramitarse después de abrir.", "Descartar la idea por completo, porque un solo obstáculo legal demuestra que el proyecto no es viable.", "Cambiar solo el menú del local, porque la demanda es el factor que decide si un negocio funciona o fracasa."], "answer": "0", "explanation": "El análisis integral revisa mercado, aspectos legales, financieros y ambientales juntos; un obstáculo se corrige antes de invertir, no se ignora ni obliga siempre a descartar."}, {"id": 27, "area": 0, "topic": "Selección de ideas", "type": "tf", "context": "Un equipo usa una matriz de criterios ponderados para elegir entre dos ideas.", "prompt": "Cambiar el peso de un criterio puede modificar cuál idea resulta ganadora.", "options": ["Verdadero", "Falso"], "answer": "0", "explanation": "El puntaje total depende de los pesos asignados; por eso los pesos deben definirse antes y reflejar lo que realmente importa al equipo."}, {"id": 28, "area": 0, "topic": "Herramientas de recolección", "type": "tf", "context": "Un equipo cuenta con una encuesta y con observación directa del comportamiento de los clientes en un local.", "prompt": "La observación directa puede mostrar conductas distintas de las declaradas en la encuesta, por lo que ambas herramientas se complementan.", "options": ["Verdadero", "Falso"], "answer": "0", "explanation": "Lo que las personas dicen y lo que hacen puede diferir; combinar encuesta (cuántos) con observación (qué hacen realmente) mejora la interpretación."}, {"id": 29, "area": 0, "topic": "Mitigación de impactos", "type": "select", "context": "Un taller de pintura automotriz genera solventes, olores y residuos peligrosos. Los vecinos se quejan de la salud de sus hijos.", "prompt": "¿Qué acción mitiga mejor el impacto?", "options": ["Instalar más ventilación para que el olor no llegue a los vecinos ni a los clientes del taller.", "Cambiar a pinturas con base de agua y entregar los residuos que queden a un gestor autorizado.", "Reducir la cantidad de pintura por servicio para disminuir los residuos y también los costos.", "Capacitar al equipo en técnicas de pintura para que cada trabajo se haga sin retrabajos."], "answer": "1", "explanation": "Mitigar es reducir el daño en su origen y manejar bien lo que queda. Las otras acciones disminuyen molestias o costos, pero no eliminan la sustancia peligrosa ni su disposición."}, {"id": 30, "area": 0, "topic": "Riesgo y financiamiento", "type": "tf", "context": "Una emprendedora recibe la aprobación de un préstamo de ₡8 000 000 antes de haber vendido su primer producto.", "prompt": "Tener el préstamo aprobado reduce el riesgo del proyecto, porque garantiza que habrá dinero mientras se valida la demanda.", "options": ["Verdadero", "Falso"], "answer": "1", "explanation": "El préstamo da liquidez, pero crea una obligación de pago. El riesgo se reduce validando con pruebas pequeñas antes de comprometer la mayor parte del dinero."}, {"id": 31, "area": 0, "topic": "Economía circular", "type": "select", "context": "Una pastelería termina cada día con pasteles sobrantes y envases usados que desecha.", "prompt": "¿Qué estrategia aplica mejor la economía circular?", "options": ["Transformar sobrantes en nuevos productos o donarlos, compostar lo no aprovechable y ofrecer envases reutilizables.", "Vender los sobrantes más baratos al final del día para recuperar el costo de producirlos.", "Comprar envases desechables más baratos para dejar de lavar y reutilizar los envases actuales.", "Aumentar la producción de la mañana para vender más y que los sobrantes sean proporcionalmente menores."], "answer": "0", "explanation": "La economía circular busca reducir, reutilizar y reciclar para mantener los materiales en uso. Vender barato o producir más no reduce la generación de residuos."}, {"id": 32, "area": 0, "topic": "Oferta, demanda y competencia", "type": "select", "context": "En un barrio abren tres lavanderías nuevas. El número de hogares no cambia y las cuatro lavanderías ofrecen el mismo servicio al mismo precio.", "prompt": "¿Qué es lo más probable y qué estrategia es coherente?", "options": ["Sube la demanda porque hay más oferta; conviene aumentar el precio para aprovechar el mayor interés de los hogares.", "Bajan los precios porque cae la demanda de cada lavandería; conviene cerrar y esperar un mercado más pequeño.", "Aumenta la competencia y presiona precios o márgenes; conviene diferenciarse en el servicio y no solo bajar el precio.", "No cambia nada, porque la oferta no influye en el precio mientras el número de hogares se mantenga igual."], "answer": "2", "explanation": "Más oferta con la misma demanda aumenta la competencia y presiona precios y márgenes; más oferta no crea por sí sola más demanda."}, {"id": 33, "area": 0, "topic": "Responsabilidades del emprendedor", "type": "select", "context": "Una emprendedora de postres factura solo una parte de sus ventas para pagar menos impuestos y entrega sus pedidos en envases desechables que terminan en una quebrada vecina.", "prompt": "¿Qué responsabilidades incumple principalmente?", "options": ["Con el Estado, por evadir impuestos; el uso de envases desechables no genera ninguna responsabilidad ambiental.", "Con la comunidad, por los envases; facturar solo parte de las ventas es una decisión financiera legítima.", "Con sus clientes, por cobrar precios altos, y con sus proveedores, por no declararles todas las ventas.", "Con el Estado, por evadir impuestos, y con la comunidad y el ambiente, por el impacto de sus residuos."], "answer": "3", "explanation": "Emprender implica responsabilidades con el Estado (pagar impuestos), con la sociedad y con el ambiente, además de las que se tienen con clientes y proveedores."}, {"id": 34, "area": 0, "topic": "Creatividad e innovación", "type": "select", "context": "Un equipo generó 40 ideas, escogió una con una matriz, construyó un prototipo, lo probó con 15 clientes y ajustó el diseño según sus comentarios.", "prompt": "¿En qué momento el proceso pasa de ser creatividad a ser innovación?", "options": ["Cuando la idea se aplica con clientes reales y se comprueba que genera valor.", "Cuando termina de generar las 40 ideas, porque ya hay resultados creativos.", "Cuando elige la mejor idea con criterios, porque ya la distingue de las demás.", "Cuando construye el prototipo, porque ya existe algo tangible que otras personas pueden ver."], "answer": "0", "explanation": "La innovación es la aplicación exitosa de la idea: se prueba, se ajusta y genera valor. Generar, elegir o prototipar son pasos previos."}, {"id": 35, "area": 0, "topic": "Desarrollo sostenible", "type": "tf", "context": "Una cafetería compra el café a una cooperativa local a precio justo, composta sus residuos de cocina y obtiene ganancias modestas.", "prompt": "Aunque sus ganancias sean modestas, puede ser un emprendimiento sostenible.", "options": ["Verdadero", "Falso"], "answer": "0", "explanation": "La sostenibilidad integra las dimensiones social (precio justo), ambiental (compostaje) y económica (cubrir costos); no exige altas ganancias."}, {"id": 36, "area": 1, "topic": "FODA interno y externo", "type": "select", "context": "Una panadería analiza su situación: (1) el personal tiene 8 años de experiencia, (2) el precio de la harina subió 18 %, (3) hay una nueva urbanización cerca, (4) el horno se daña con frecuencia.", "prompt": "¿Cuál clasificación es correcta?", "options": ["(1) oportunidad, (2) debilidad, (3) fortaleza, (4) amenaza.", "(1) fortaleza, (2) debilidad, (3) amenaza, (4) oportunidad.", "(1) fortaleza, (2) amenaza, (3) oportunidad, (4) debilidad.", "(1) debilidad, (2) amenaza, (3) fortaleza, (4) oportunidad."], "answer": "2", "explanation": "Fortalezas y debilidades son internas y controlables; oportunidades y amenazas vienen del entorno, como el precio de un insumo o una urbanización."}, {"id": 37, "area": 1, "topic": "Etapas de Design Thinking", "type": "select", "context": "Un grupo entrevistó a 15 estudiantes sobre el almuerzo en el colegio. Tienen muchas notas, pero el equipo no se pone de acuerdo: unos creen que el problema es el precio, otros la fila y otros la variedad.", "prompt": "¿En qué etapa están y cuál es el siguiente paso adecuado?", "options": ["Están en prototipar y deben construir una cafetería nueva de inmediato para comprobar cuál de las tres causas es la correcta.", "Están en idear y deben votar la solución más popular entre el grupo sin volver a revisar lo que dijeron los estudiantes.", "Terminaron de empatizar y deben definir: sintetizar las notas en un enunciado del problema desde la perspectiva del estudiante, antes de idear.", "Están en testear y deben repetir las mismas 15 entrevistas hasta que todas las personas coincidan en una sola causa."], "answer": "2", "explanation": "Después de empatizar sigue definir, para convertir las observaciones en un problema claro; sin eso las ideas se dispersan."}, {"id": 38, "area": 1, "topic": "Asignación a los bloques", "type": "select", "context": "Una academia de música privada anota: (1) mensualidad de cada estudiante, (2) alquiler del local, (3) instructores contratados por hora, (4) alianza con una tienda de instrumentos que ofrece descuentos a sus estudiantes.", "prompt": "¿Qué asignación de bloques del Canvas es correcta para los cuatro elementos, en ese orden?", "options": ["Fuentes de ingreso, estructura de costos, recursos clave (humanos), aliados clave.", "Fuentes de ingreso, actividades clave, estructura de costos, canales de distribución.", "Estructura de costos, estructura de costos, recursos clave (físicos), relación con clientes.", "Propuesta de valor, estructura de costos, aliados clave, segmentos de clientes."], "answer": "0", "explanation": "La mensualidad es dinero que entra; el alquiler es un costo; los instructores son recurso humano; la tienda es un aliado externo que complementa la oferta."}, {"id": 39, "area": 1, "topic": "Punto de equilibrio", "type": "fill", "context": "Un negocio de bolsos tiene costos fijos de ₡270 000 al mes. Vende cada bolso a ₡7 500 y su costo variable por bolso es de ₡4 500.", "prompt": "¿Cuántos bolsos debe vender al mes para llegar al punto de equilibrio? Escriba solo el número.", "answer": "90", "accepted": ["90"], "explanation": "Margen de contribución = 7 500 − 4 500 = 3 000. PE = 270 000 ÷ 3 000 = 90 bolsos."}, {"id": 40, "area": 1, "topic": "Utilidad y efectivo", "type": "tf", "context": "Un negocio vendió ₡900 000 en el mes y su utilidad fue positiva, pero casi todas las ventas fueron a crédito y todavía no se han cobrado.", "prompt": "Aunque tenga utilidad, el negocio puede enfrentar falta de efectivo, porque la utilidad no registra cuándo se cobra o se paga el dinero.", "options": ["Verdadero", "Falso"], "answer": "0", "explanation": "La utilidad compara ingresos y costos del período; el flujo de efectivo muestra las entradas y salidas reales de dinero."}, {"id": 41, "area": 1, "topic": "Design Thinking", "type": "tf", "context": "Tras el testeo de un prototipo, un grupo descubre que los usuarios usan el producto de una forma distinta a la imaginada.", "prompt": "Como el testeo es la última etapa del proceso, el equipo ya no puede volver a etapas anteriores y debe presentar el producto como está.", "options": ["Verdadero", "Falso"], "answer": "1", "explanation": "Design Thinking es iterativo: lo aprendido al testear permite volver a definir, idear o prototipar."}, {"id": 42, "area": 1, "topic": "Producto mínimo viable", "type": "tf", "context": "Un equipo lanzó un servicio simple de entregas en bicicleta y empezó a recoger datos desde el primer día, pero aún no decidió qué considerará éxito.", "prompt": "Es correcto esperar a ver los resultados para definir la métrica de éxito, porque así se evita fijar metas imposibles.", "options": ["Verdadero", "Falso"], "answer": "1", "explanation": "El criterio debe definirse antes de la prueba; si se fija después, se interpreta el resultado a conveniencia."}, {"id": 43, "area": 1, "topic": "Cooperativas", "type": "tf", "context": "En la asamblea de una cooperativa, una asociada que aportó mucho más capital que el resto quiere tener más votos.", "prompt": "En una cooperativa cada asociado tiene un voto, sin importar cuánto capital haya aportado.", "options": ["Verdadero", "Falso"], "answer": "0", "explanation": "El principio de gestión democrática establece «una persona, un voto», sin relación con el aporte económico."}, {"id": 44, "area": 1, "topic": "Margen bruto", "type": "select", "context": "Dos productos de una tienda: la mermelada se vende a ₡3 000 y su costo variable es ₡1 800; las galletas se venden a ₡2 000 y su costo variable es ₡1 400.", "prompt": "Según el margen bruto, ¿cuál producto aporta más y cómo se compara con el 40 % de referencia?", "options": ["Galletas: 70 % frente a 60 % de la mermelada, porque el costo variable más bajo en colones siempre significa más margen.", "Mermelada: 40 % frente a 30 % de las galletas; la mermelada aporta más por cada colón vendido y cumple la referencia.", "Ambos productos aportan igual, porque cada uno deja ₡600 por unidad y el margen bruto no depende del precio.", "Mermelada: 60 % frente a 70 % de las galletas, por lo que ninguna llega al 40 % y las dos deben descartarse."], "answer": "1", "explanation": "Margen bruto = (precio − costo variable) ÷ precio: mermelada 1 200 ÷ 3 000 = 40 %; galletas 600 ÷ 2 000 = 30 %."}, {"id": 45, "area": 1, "topic": "Matriz CAME", "type": "tf", "context": "Un equipo termina su FODA y afirma: «ya tenemos las estrategias, la matriz CAME no hace falta porque el FODA ya las define».", "prompt": "El FODA es un diagnóstico; la matriz CAME lo convierte en acciones para corregir, afrontar, mantener y explotar.", "options": ["Verdadero", "Falso"], "answer": "0", "explanation": "El FODA describe la situación; CAME define qué hacer con cada elemento y por eso se usa después."}, {"id": 46, "area": 1, "topic": "Errores de negociación", "type": "select", "context": "En una reunión, un emprendedor presenta de entrada su lista de precios, acepta la primera rebaja que le piden «para no incomodar» y deja el acuerdo sin escribirlo.", "prompt": "¿Qué errores señalados por el manual aparecen en esa conducta?", "options": ["Usar la técnica del silencio, hacer concesiones escalonadas y practicar la escucha activa.", "Hablar primero del precio, ceder rápido y no formalizar el acuerdo.", "Aplicar el anclaje numérico, buscar el ganar-ganar y definir una mejor alternativa de antemano.", "Sobreprepararse, escuchar en exceso y negociar demasiado sobre los intereses de la otra persona."], "answer": "1", "explanation": "Los errores comunes son hablar primero del precio, ceder rápido, quedar bien sacrificando valor y no formalizar lo acordado."}, {"id": 47, "area": 1, "topic": "Utilidad operativa", "type": "fill", "context": "Un negocio vendió en el mes ₡520 000. Sus costos variables fueron de ₡262 000 y sus costos fijos de ₡160 000.", "prompt": "¿Cuál fue la utilidad, en colones? Escriba solo el número, sin puntos ni signo de colones.", "answer": "98000", "accepted": ["98000", "98 000", "98.000"], "explanation": "Utilidad = 520 000 − 262 000 − 160 000 = 98 000."}, {"id": 48, "area": 1, "topic": "Segmento de clientes", "type": "tf", "context": "Una persona emprendedora comienza con un nicho muy concreto (por ejemplo, ciclistas de montaña de su cantón) en lugar de intentar atender a todo el mercado.", "prompt": "Empezar por un nicho puede mejorar la propuesta de valor, porque permite conocer con más precisión las necesidades del segmento.", "options": ["Verdadero", "Falso"], "answer": "0", "explanation": "Un nicho facilita entender necesidades, diseñar la propuesta y elegir canales; luego se puede ampliar."}, {"id": 49, "area": 1, "topic": "Producto mínimo viable", "type": "select", "context": "Dos estudiantes quieren vender comida saludable para llevar a oficinistas. Una opción es construir una aplicación completa; otra es publicar un menú semanal con pedidos por WhatsApp y entregar en un barrio durante un mes.", "prompt": "¿Cuál enfoque corresponde a un producto mínimo viable y por qué?", "options": ["La aplicación completa, porque un PMV debe tener todas las funciones para que el cliente no perciba una versión incompleta.", "El menú por WhatsApp, porque un PMV siempre se vende gratis para atraer clientes y medir cuántas personas lo prueban.", "Ninguno, porque un PMV consiste en un prototipo físico del producto terminado y no en una prueba de venta con clientes.", "El del menú por WhatsApp, porque permite aprender qué piden y cuánto pagan con poca inversión antes de automatizar nada."], "answer": "3", "explanation": "El PMV es la versión más simple que permite aprender del cliente; construir antes de validar arriesga recursos en una solución no probada."}, {"id": 50, "area": 1, "topic": "Fuentes de financiamiento", "type": "select", "context": "Una joven emprendedora necesita ₡3 000 000 para un horno y materiales. Tiene ahorros de ₡600 000. Una opción es un préstamo con tasa alta y pago inmediato; otra es un fondo no reembolsable del MEIC que cubre ₡1 500 000 con exigencia de informes; otra es vender por adelantado a clientes.", "prompt": "¿Qué estrategia respeta mejor los criterios de costo real, flexibilidad y autonomía?", "options": ["Pedir todo el préstamo ahora, porque contar con la totalidad del dinero desde el inicio evita retrasos y reduce el riesgo.", "Esperar hasta reunir los ₡3 000 000 con ahorros propios, porque cualquier fuente externa elimina la autonomía del proyecto.", "Usar solo el fondo del MEIC, porque un fondo que no se paga siempre es mejor que cualquier combinación con otras fuentes.", "Combinar escalonadamente: ahorros, el fondo no reembolsable y preventas, y pedir crédito solo por el faltante cuando ya haya ventas."], "answer": "3", "explanation": "El manual propone combinar fuentes de forma escalonada: recursos propios y no reembolsables primero y crédito después de validar."}, {"id": 51, "area": 1, "topic": "Orden de herramientas", "type": "select", "context": "Una cafetería quiere reaccionar a la apertura de una cadena nacional cerca de su local. El equipo propone usar FODA, PESTEL, CAME, Design Thinking y Lean Startup.", "prompt": "¿Qué secuencia de uso tiene mayor lógica para el manual?", "options": ["FODA (diagnóstico), PESTEL (contexto), CAME (estrategias), Design Thinking (solución con el usuario) y Lean Startup (validación).", "Lean Startup (validar), Design Thinking, PESTEL, FODA y CAME al final para resumir los resultados con un informe.", "CAME (estrategias), FODA, Design Thinking, PESTEL y Lean Startup, porque las acciones siempre deben definirse primero.", "PESTEL, Lean Startup, CAME, FODA y Design Thinking, porque el entorno se estudia antes y el diagnóstico interno al final."], "answer": "0", "explanation": "Primero se diagnostica y se mira el entorno, luego se decide qué hacer, se diseña con el usuario y finalmente se valida con pruebas."}, {"id": 52, "area": 1, "topic": "Negociación ganar-ganar", "type": "tf", "context": "Dos socios negocian con un distribuidor. Uno propone «cedamos cada uno exactamente lo mismo en precio y plazo para que sea justo».", "prompt": "Esa propuesta ilustra el intercambio ganar-ganar, que consiste en que cada parte ceda siempre la misma cantidad.", "options": ["Verdadero", "Falso"], "answer": "1", "explanation": "El ganar-ganar consiste en intercambiar cosas que a una parte le cuestan poco y a la otra le importan mucho."}, {"id": 53, "area": 1, "topic": "Costos fijos y variables", "type": "select", "context": "Un negocio de empanadas paga alquiler de ₡180 000 mensuales, cargas sociales de dos empleados, harina y relleno por cada empanada y bolsas para entrega. Si las ventas se duplican el próximo mes:", "prompt": "¿Qué efecto esperaría en sus costos?", "options": ["Todos los costos se duplican, porque cuando se vende más cada rubro del negocio aumenta en la misma proporción.", "Solo se duplican las cargas sociales, porque se calculan sobre las ventas y no sobre los salarios de las personas.", "Se duplican el alquiler y las bolsas, mientras que la harina permanece estable porque se compra al por mayor.", "Los variables (harina, relleno, bolsas) se duplican; el alquiler y las cargas sociales de salarios fijos se mantienen."], "answer": "3", "explanation": "Los costos fijos no dependen del volumen en el corto plazo; los variables cambian con las unidades producidas o vendidas."}, {"id": 54, "area": 1, "topic": "Punto de equilibrio", "type": "select", "context": "Una cafetería tiene un punto de equilibrio de 600 tazas por mes. El dueño decide subir el alquiler del local en ₡60 000 mensuales; cada taza se vende a ₡2 000 con costo variable de ₡800.", "prompt": "¿Qué efecto tendrá y de cuánto?", "options": ["El punto de equilibrio baja, porque pagar más alquiler indica un mejor local y eso eleva las ventas esperadas por taza.", "El punto de equilibrio sube en 75 tazas por mes, porque se divide el aumento entre el costo variable de ₡800.", "El punto de equilibrio no cambia, porque el alquiler es un costo que no entra en el cálculo de unidades.", "El punto de equilibrio sube en 50 tazas por mes, porque el aumento de costos fijos se divide entre el margen de ₡1 200 por taza."], "answer": "3", "explanation": "PE = costos fijos ÷ margen de contribución; el aumento de 60 000 entre 1 200 por taza equivale a 50 unidades más."}, {"id": 55, "area": 1, "topic": "Gestión democrática", "type": "fill", "context": "En una cooperativa, el voto de cada asociado no depende del ________ que haya aportado. Escriba una palabra.", "prompt": "Complete con la palabra que falta.", "answer": "capital", "accepted": ["capital", "dinero", "aporte"], "explanation": "En una cooperativa rige «una persona, un voto» y el voto es independiente del capital."}, {"id": 56, "area": 1, "topic": "Coherencia del Canvas", "type": "select", "context": "Un emprendimiento ofrece recorridos guiados en inglés por una finca cafetalera. En su Canvas escribió: segmento «turistas extranjeros», canal «volantes en el barrio» y relación con clientes «atención personal durante el recorrido».", "prompt": "¿Qué incoherencia principal presenta ese Canvas?", "options": ["La relación con clientes contradice al segmento: la atención personal solo funciona con clientes locales que ya conozcan la finca.", "La propuesta de valor sobra: un recorrido guiado no necesita explicarse porque el cliente ya sabe qué espera de una finca.", "El canal no llega al segmento: los turistas extranjeros no ven volantes de barrio y necesitan canales como hoteles o redes en inglés.", "El segmento es demasiado reducido: un Canvas siempre debe dirigirse a todos los públicos para no perder ventas posibles."], "answer": "2", "explanation": "Los bloques deben sostenerse entre sí. El segmento define a quién se quiere llegar y el canal debe alcanzar justamente a esas personas."}, {"id": 57, "area": 1, "topic": "Valores éticos aplicados", "type": "select", "context": "Un emprendimiento escolar vende cuadernos reciclados. Un lote llegó con las hojas despegadas. Los socios deciden devolver el dinero a quienes lo compraron, publicar lo ocurrido y repartir por igual el bono entre todas las personas socias.", "prompt": "¿Qué valores ilustran esas decisiones?", "options": ["Respeto (devolver el dinero), solidaridad (publicar lo ocurrido) y honestidad (repartir el bono entre todas las personas).", "Justicia (devolver el dinero), honestidad (informar lo ocurrido) y equidad (mismo bono para todas las personas).", "Equidad (devolver el dinero), justicia (informar lo ocurrido) y respeto (publicar el reparto del bono entre todas las personas).", "Honestidad (devolver el dinero), equidad (informar lo ocurrido) y solidaridad (mismo bono para todas las personas)."], "answer": "1", "explanation": "Corregir un daño al cliente es justicia, informar con verdad es honestidad y dar igual trato en el reparto es equidad."}, {"id": 58, "area": 1, "topic": "Matriz CAME", "type": "select", "context": "El FODA de una tienda de artesanías dice: Debilidad: no vende en línea. Oportunidad: más turistas que buscan souvenirs locales. Amenaza: productos importados más baratos. Fortaleza: diseños exclusivos hechos a mano.", "prompt": "¿Qué conjunto de acciones aplica correctamente la matriz CAME?", "options": ["Corregir: bajar los precios de los diseños; Explotar: importar productos baratos; Afrontar: abrir ventas en línea; Mantener: más turistas.", "Corregir: abrir ventas en línea; Explotar: paquetes para turistas; Afrontar: destacar el trabajo artesanal; Mantener: los diseños exclusivos.", "Corregir: paquetes para turistas; Explotar: abrir ventas en línea; Afrontar: los diseños exclusivos; Mantener: bajar precios.", "Corregir: destacar el trabajo artesanal; Explotar: los diseños exclusivos; Afrontar: más turistas; Mantener: ventas en línea."], "answer": "1", "explanation": "CAME significa corregir debilidades, afrontar amenazas, mantener fortalezas y explotar oportunidades; cada acción debe corresponder a su cuadrante."}, {"id": 59, "area": 1, "topic": "Flujo de efectivo", "type": "fill", "context": "En un mes, un taller cobró ₡480 000 en efectivo por trabajos realizados y pagó ₡345 000 entre insumos, planilla y servicios.", "prompt": "¿Cuál fue el flujo de efectivo del mes, en colones? Escriba solo el número, sin puntos ni signo de colones.", "answer": "135000", "accepted": ["135000", "135 000", "135.000"], "explanation": "Flujo de efectivo = entradas − salidas = 480 000 − 345 000 = 135 000."}, {"id": 60, "area": 1, "topic": "Interpretar un testeo", "type": "select", "context": "Un equipo prueba un prototipo de aplicación para pedir comida en el comedor. En el testeo, 7 de 10 usuarios no encuentran el botón para pagar y abandonan el proceso, aunque dicen que la idea les gusta.", "prompt": "¿Qué conclusión y decisión son más adecuadas?", "options": ["La idea fracasó porque 7 de 10 abandonaron y se debe descartar la aplicación completa sin hacer más pruebas.", "El prototipo funciona porque a los usuarios les gusta la idea y se debe pasar a lanzarlo sin modificar el botón de pago.", "El problema está en la interfaz, no en la idea: se vuelve a prototipar el flujo de pago y se prueba de nuevo con usuarios.", "Los usuarios no entienden la propuesta y hay que regresar a empatizar con otra población distinta antes de cualquier ajuste."], "answer": "2", "explanation": "El testeo reveló un obstáculo concreto de uso; Design Thinking es iterativo y permite volver a prototipar y comprobar la mejora."}, {"id": 61, "area": 1, "topic": "Capital de trabajo", "type": "select", "context": "Un taller de uniformes recibe un pedido grande de una empresa que paga a 45 días. Debe comprar telas de contado y pagar planilla cada quincena. Sus ventas del mes son buenas, pero ya casi no tiene efectivo.", "prompt": "¿Qué situación explica mejor el problema?", "options": ["Falta capital de trabajo: gasta antes de cobrar, así que el desfase entre pagos y cobros agota el efectivo aunque haya ventas.", "Falta inversión fija: el taller debe comprar más máquinas, porque vender mucho siempre significa que el equipo es insuficiente.", "Falta rentabilidad: si el efectivo escasea es porque el precio no cubre los costos, aunque el pedido sea grande y constante.", "Falta formalizar al cliente: si la empresa pagara de contado no existiría ninguna presión sobre el efectivo disponible."], "answer": "0", "explanation": "El capital de trabajo cubre los gastos de operar mientras entran los cobros; con ventas a crédito la necesidad aumenta."}, {"id": 62, "area": 1, "topic": "Umbral de validación", "type": "fill", "context": "Un equipo decidió que su hipótesis se validará si al menos el 20 % de 45 personas invitadas se inscribe en un taller de prueba.", "prompt": "¿Cuántas inscripciones como mínimo se necesitan? Escriba solo el número.", "answer": "9", "accepted": ["9"], "explanation": "45 × 20 ÷ 100 = 9 inscripciones."}, {"id": 63, "area": 1, "topic": "Intereses y alternativa", "type": "select", "context": "Un proveedor ofrece a una pastelería harina a ₡18 000 por saco y rechaza bajar el precio. La pastelería necesita buena calidad y entrega puntual, y tiene otra oferta de ₡18 500 por saco con entrega semanal garantizada.", "prompt": "¿Cuál estrategia aprovecha mejor sus intereses y su mejor alternativa?", "options": ["Aceptar de inmediato los ₡18 000, porque el precio más bajo es lo único que realmente importa en toda negociación.", "Amenazar con dejar de comprar para obligarlo a bajar, porque la presión directa funciona mejor que ofrecer algo a cambio.", "Ocultar que existe otra oferta, porque revelar cualquier alternativa debilita la posición durante la conversación.", "Proponer compras mayores y pago a 15 días a cambio de un precio menor, sabiendo que puede aceptar la otra oferta."], "answer": "3", "explanation": "Conocer la mejor alternativa da fuerza para negociar; ofrecer volumen y pago ágil es intercambio de algo barato para ella y valioso para el proveedor."}, {"id": 64, "area": 1, "topic": "Tasa de conversión", "type": "fill", "context": "Una página de lanzamiento recibió 72 visitas y 18 personas dejaron sus datos para pre-registrarse.", "prompt": "¿Cuál es la tasa de conversión? Escriba solo el número, sin el signo %.", "answer": "25", "accepted": ["25"], "explanation": "Conversión = 18 ÷ 72 × 100 = 25 %."}, {"id": 65, "area": 1, "topic": "Criterio de éxito y umbral", "type": "select", "context": "Para validar una clase de repostería, un grupo definió: «tendremos éxito si al menos el 30 % de las 50 personas que reciban la invitación reserva un cupo». Reservaron 11 personas.", "prompt": "¿Qué decisión es coherente con el criterio definido?", "options": ["Se cumplió, porque 11 reservas de 50 invitados superan el 20 % y eso ya demuestra que existe demanda suficiente.", "Se cumplió, porque cualquier reserva real vale más que una opinión y por eso el criterio inicial puede ignorarse.", "No se cumplió (el umbral era 15 reservas): se debe ajustar la oferta o pivotar y volver a probar con el nuevo criterio.", "No se puede decidir, porque los criterios de éxito solo se calculan después de conocer cuántas personas respondieron."], "answer": "2", "explanation": "El umbral es 30 % de 50, es decir 15; 11 queda por debajo. El criterio se definió antes de probar y se respeta aunque haya interés."}, {"id": 66, "area": 1, "topic": "Canvas: canales", "type": "fill", "context": "En el Canvas, el bloque que describe cómo la empresa comunica su propuesta y entrega el producto al cliente (tienda física, redes sociales, entrega a domicilio) se llama ________.", "prompt": "Complete con la palabra que corresponde al bloque. Escriba una sola palabra.", "answer": "canales", "accepted": ["canales", "los canales", "canal"], "explanation": "El bloque de canales define los medios por los cuales se llega al cliente y se entrega la propuesta de valor."}, {"id": 67, "area": 1, "topic": "Evidencia de demanda", "type": "select", "context": "Cuatro grupos validaron una idea de servicio de mantenimiento de bicicletas. Grupo A: 40 personas dijeron «me interesaría». Grupo B: 12 personas pagaron un adelanto de ₡2 000 para reservar el primer servicio. Grupo C: 90 «me gusta» en una publicación. Grupo D: 25 amistades prometieron recomendarlo.", "prompt": "¿Cuál grupo tiene la evidencia de demanda más sólida?", "options": ["El grupo C, porque 90 interacciones públicas muestran un volumen de interés superior al de cualquier otro grupo.", "El grupo B, porque pagar un adelanto es una conducta que compromete dinero y es más confiable que una intención declarada.", "El grupo A, porque 40 personas es el mayor número de respuestas directas y la intención expresada ya predice la compra.", "El grupo D, porque las recomendaciones entre amistades garantizan que la demanda se mantendrá en el tiempo."], "answer": "1", "explanation": "Una conducta de pago revela disposición real; las opiniones, los «me gusta» y las promesas informales tienen menos peso como evidencia."}, {"id": 68, "area": 1, "topic": "Formalización", "type": "select", "context": "Dos amigos abrirán un local de comidas rápidas y contratarán a tres personas. Ya tienen alquilado el local.", "prompt": "¿Qué conjunto de trámites responde mejor a esa situación?", "options": ["Solo la patente municipal, porque es la licencia que autoriza el funcionamiento y reemplaza a los demás permisos.", "Inscripción en Hacienda y la patente, porque las pólizas y los permisos sanitarios solo se piden a grandes empresas.", "Permiso sanitario y CCSS únicamente, porque son las instituciones que supervisan alimentos y personas contratadas.", "Inscripción en Hacienda, patrono en CCSS, póliza de riesgos del trabajo, uso de suelo, permiso sanitario y patente municipal."], "answer": "3", "explanation": "Contratar personal exige CCSS y póliza; manipular alimentos exige permiso sanitario; la actividad exige uso de suelo, patente y registro tributario."}, {"id": 69, "area": 1, "topic": "Propuesta de valor", "type": "select", "context": "Dos negocios de lavandería compiten en el mismo barrio. El primero afirma «lavamos con máquinas modernas». El segundo promete «recogemos y entregamos en 24 horas, y si la prenda no queda limpia la lavamos otra vez sin costo».", "prompt": "Desde el Canvas, ¿cuál diferencia mejor su propuesta de valor y por qué?", "options": ["La del primero, porque la tecnología es lo que más valoran los clientes de cualquier servicio y la hace imposible de copiar.", "La del segundo, porque describe un resultado para el cliente (tiempo y garantía) y no solo una característica interna del negocio.", "Ambas son iguales, porque la propuesta de valor siempre se limita a describir los recursos con que cuenta cada negocio.", "La del segundo, porque ofrecer garantía convierte la propuesta de valor en un costo y eso mejora la estructura de costos."], "answer": "1", "explanation": "La propuesta de valor expresa el beneficio que recibe el cliente y no el equipo que usa la empresa; el resultado prometido es medible y diferenciador."}, {"id": 70, "area": 1, "topic": "Cooperativa o solidarista", "type": "select", "context": "Un grupo de 20 agricultores de varias fincas quiere vender su producción juntos, repartir los excedentes según las compras de cada uno y decidir con igualdad de voto. Por otro lado, los trabajadores de una fábrica quieren un fondo de ahorro y créditos con aporte de la empresa.", "prompt": "¿Qué figura corresponde a cada grupo?", "options": ["Agricultores: cooperativa (Ley 4179); trabajadores de la fábrica: asociación solidarista (Ley 6970).", "Agricultores: asociación solidarista (Ley 6970); trabajadores de la fábrica: cooperativa (Ley 4179).", "Ambos grupos: cooperativa, porque cualquier forma de ahorro o de comercialización conjunta se rige por la Ley 4179.", "Agricultores: sociedad anónima; trabajadores de la fábrica: cooperativa, porque ambas figuras reparten los excedentes."], "answer": "0", "explanation": "La cooperativa reúne personas con una actividad común y un voto por asociado; la solidarista agrupa trabajadores de una empresa con ahorro y aporte patronal."}, {"id": 71, "area": 2, "topic": "Cadena de valor", "type": "fill", "context": "En la cadena de valor de Porter, la logística de entrada, las operaciones y el marketing y ventas son actividades primarias; la gestión de recursos humanos y el abastecimiento son actividades de ________. Escriba una palabra.", "prompt": "Complete con la palabra que falta.", "answer": "apoyo", "accepted": ["apoyo", "soporte"], "explanation": "Las actividades de apoyo sostienen a las primarias: infraestructura, recursos humanos, tecnología y abastecimiento."}, {"id": 72, "area": 2, "topic": "Fidelización y CRM", "type": "select", "context": "Una librería registra en una base de datos qué compra cada cliente y cada mes envía recomendaciones y descuentos según sus gustos. Los clientes frecuentes reciben una invitación especial a lanzamientos.", "prompt": "¿Qué estrategia aplica y cuál es su principal ventaja?", "options": ["Fidelización con apoyo de un CRM; retener cuesta hasta cinco veces menos que conseguir clientes nuevos.", "Publicidad masiva; su ventaja es llegar a clientes que nunca han comprado y que aún no conocen a la librería.", "Control de inventario; su ventaja es reducir las compras de libros que no se venden con rapidez a los clientes.", "Reducción de precios; su ventaja es que cualquier descuento aumenta de manera automática la satisfacción del cliente."], "answer": "0", "explanation": "Un CRM reúne datos para personalizar la comunicación y fidelizar; conservar clientes es más económico que adquirirlos."}, {"id": 73, "area": 2, "topic": "Cargas sociales", "type": "fill", "context": "Una persona trabajadora recibe un salario de ₡400 000. Para efectos de costo, el patrono suma cargas sociales de aproximadamente el 26 % sobre ese salario.", "prompt": "¿Cuál es el costo total para el patrono, en colones? Escriba solo el número, sin puntos ni signo de colones.", "answer": "504000", "accepted": ["504000", "504 000", "504.000"], "explanation": "400 000 × 1,26 = 504 000."}, {"id": 74, "area": 2, "topic": "Retención de clientes", "type": "fill", "context": "El mes pasado un gimnasio tuvo 120 clientes. Este mes continuaron 84 de ellos.", "prompt": "¿Cuál es la tasa de retención? Escriba solo el número, sin el signo %.", "answer": "70", "accepted": ["70"], "explanation": "84 ÷ 120 × 100 = 70 %."}, {"id": 75, "area": 2, "topic": "Control administrativo", "type": "select", "context": "Antes de pagar una factura a un proveedor, la encargada compara la orden de compra, la factura y el recibo de mercadería. Al final del mes, verifica que el saldo de los libros coincida con el estado de cuenta bancario.", "prompt": "¿Qué controles aplica y de qué fase del proceso administrativo forman parte?", "options": ["Planificación y organización; sirven para definir metas del próximo año y asignar tareas a cada persona.", "Dirección y motivación; sirven para que el personal de compras se sienta valorado y mantenga su desempeño.", "Cotejo de tres documentos y conciliación bancaria; forman parte del control, que corrige desviaciones.", "Cotejo y conciliación; son parte de la organización, porque ordenan los recursos y los documentos del negocio."], "answer": "2", "explanation": "El cotejo evita pagos indebidos y la conciliación detecta diferencias; ambos comparan lo real con lo registrado y son parte del control."}, {"id": 76, "area": 2, "topic": "Empresas sin fines de lucro", "type": "tf", "context": "Una asociación comunitaria vende artesanías en una feria y con lo recaudado paga becas para jóvenes de la comunidad.", "prompt": "Una organización sin fines de lucro no puede cobrar por sus productos o servicios, porque cobrar implica distribuir ganancias entre sus integrantes.", "options": ["Verdadero", "Falso"], "answer": "1", "explanation": "Puede cobrar y generar excedentes; lo que distingue es que los destina a su misión social y no los reparte entre propietarios."}, {"id": 77, "area": 2, "topic": "Forma jurídica y patrimonio", "type": "select", "context": "Tres amigas iniciarán una empresa de eventos con alto riesgo de deudas por alquiler de equipo. Quieren que, si el negocio fracasa, sus casas y ahorros personales no respondan por las deudas. Además desean que cada una pueda vender su participación a otra persona en el futuro.", "prompt": "¿Qué forma jurídica responde mejor a ambos criterios?", "options": ["Empresa individual, porque cada amiga controla por completo su parte y puede venderla cuando quiera sin formalidades.", "Sociedad de responsabilidad limitada, porque las participaciones se transmiten libremente a cualquier persona externa.", "Cooperativa, porque protege el patrimonio personal y reparte las ganancias según el capital aportado por cada una.", "Sociedad anónima, porque limita la responsabilidad al aporte y permite transmitir las acciones con facilidad."], "answer": "3", "explanation": "La S.A. limita la responsabilidad al aporte y sus acciones son transmisibles; en la S.R.L. las participaciones no se transmiten libremente."}, {"id": 78, "area": 2, "topic": "Relación laboral real", "type": "select", "context": "Marcos presta servicios de cocina a un restaurante, cumple un horario fijo de lunes a sábado, recibe órdenes de la gerente y se le paga un monto mensual. Firmó un documento que lo llama «prestación de servicios profesionales» para que no haya cargas sociales.", "prompt": "¿Cómo se analiza esa situación?", "options": ["Se examinan los hechos: horario, subordinación y salario sugieren una relación laboral, aunque el documento diga otra cosa.", "Es un servicio profesional, porque lo que determina el tipo de relación es el nombre que le pongan las partes al documento.", "Es una relación laboral solo si Marcos reclama ante un juez, porque antes de eso el contrato firmado tiene validez total.", "Es un contrato por obra determinada, porque Marcos presta un servicio específico en la cocina del restaurante."], "answer": "0", "explanation": "En materia laboral prevalece la realidad: subordinación, horario y remuneración, no el título del documento."}, {"id": 79, "area": 2, "topic": "Quejas y reclamos", "type": "tf", "context": "Un cliente escribe: «Estoy molesto por la demora». Otro escribe: «Compré un producto defectuoso y exijo el cambio o la devolución de mi dinero».", "prompt": "Ambas comunicaciones son quejas, porque en un servicio al cliente toda comunicación de insatisfacción exige el mismo tratamiento.", "options": ["Verdadero", "Falso"], "answer": "1", "explanation": "La queja expresa insatisfacción; el reclamo exige una solución o compensación concreta."}, {"id": 80, "area": 2, "topic": "Estudio financiero", "type": "select", "context": "Un plan de negocios muestra una utilidad proyectada positiva en el estado de resultados. Sin embargo, el flujo de caja del tercer mes muestra un saldo negativo por pagar equipo antes de cobrar las primeras ventas.", "prompt": "¿Qué interpretación es correcta?", "options": ["El estado de resultados es suficiente: si la utilidad proyectada es positiva, el saldo negativo del flujo de caja no tiene importancia.", "El flujo de caja alerta de un problema de liquidez que el estado de resultados no muestra; se debe prever financiamiento para ese período.", "El flujo de caja está mal elaborado: una utilidad positiva implica que siempre habrá efectivo disponible en todos los meses.", "Ambos documentos muestran lo mismo, porque la utilidad y el efectivo se calculan restando los mismos rubros en cada período."], "answer": "1", "explanation": "El flujo de caja registra cuándo entra y sale el dinero; por eso permite anticipar faltantes aunque la utilidad proyectada sea positiva."}, {"id": 81, "area": 2, "topic": "Clasificación múltiple", "type": "select", "context": "Una cooperativa de productores de café, formada con capital de sus asociados, exporta su producción a Europa.", "prompt": "¿Cuál clasificación combinada es correcta?", "options": ["Por forma jurídica: cooperativa; por origen del capital: privada; por ámbito: internacional; por sector: primario.", "Por forma jurídica: sociedad anónima; por origen del capital: pública; por ámbito: nacional; por sector: secundario.", "Por forma jurídica: cooperativa; por origen del capital: mixta; por ámbito: local; por sector: terciario.", "Por forma jurídica: asociación solidarista; por origen del capital: privada; por ámbito: internacional; por sector: cuaternario."], "answer": "0", "explanation": "El capital proviene de particulares (privada), exporta (internacional) y extrae un producto agrícola (primario)."}, {"id": 82, "area": 2, "topic": "Protección de datos", "type": "tf", "context": "Una tienda recoge nombres, teléfonos y direcciones de sus clientes en una base de datos para enviar promociones.", "prompt": "Debe cuidar la protección de esos datos personales y usarlos solo para los fines que el cliente conoce y acepta.", "options": ["Verdadero", "Falso"], "answer": "0", "explanation": "Los datos personales deben protegerse y utilizarse con transparencia; es parte de la responsabilidad legal y ética."}, {"id": 83, "area": 2, "topic": "Atención vs. servicio", "type": "select", "context": "Una tienda en línea tiene un chat que responde dudas en minutos. Además registra por qué se devuelven los productos, analiza el patrón de quejas, capacita al personal y cambia empaques para evitar daños en el envío.", "prompt": "¿Qué diferencia ilustra este caso?", "options": ["Todo es atención al cliente, porque cualquier acción que involucre comunicación con compradores se considera atención.", "El chat es servicio al cliente y el análisis de quejas es atención, porque este último se hace con datos internos.", "El chat es atención al cliente (interacción puntual); el seguimiento, análisis y mejora conforman el servicio integral.", "No existe diferencia, porque servicio y atención son términos intercambiables en cualquier negocio con ventas en línea."], "answer": "2", "explanation": "La atención resuelve contactos puntuales; el servicio incluye prevención, seguimiento y mejora continua."}, {"id": 84, "area": 2, "topic": "Reproceso", "type": "fill", "context": "Una panadería produjo 400 unidades en un día y tuvo que rehacer 28 por no cumplir con la calidad.", "prompt": "¿Qué porcentaje de reproceso representa? Escriba solo el número, sin el signo %.", "answer": "7", "accepted": ["7"], "explanation": "28 ÷ 400 × 100 = 7 %."}, {"id": 85, "area": 2, "topic": "Compras del Estado", "type": "tf", "context": "Una empresa de limpieza formalizada quiere vender sus servicios a instituciones públicas mediante licitaciones.", "prompt": "La participación en compras del Estado es una transacción comercial posible para una empresa con sus trámites legales al día.", "options": ["Verdadero", "Falso"], "answer": "0", "explanation": "La puesta en operación incluye transacciones B2B y la participación en compras públicas cuando la empresa está formalizada."}, {"id": 86, "area": 2, "topic": "Principios de Fayol", "type": "select", "context": "En una tienda, Daniela recibe instrucciones contradictorias de la gerente de ventas y del gerente de bodega. Además, se le exige cumplir metas, pero no se le permite decidir descuentos ni compras.", "prompt": "¿Qué principios de Fayol se están incumpliendo?", "options": ["División del trabajo (hay demasiada especialización) y disciplina (Daniela no respeta las normas de la tienda).", "Unidad de mando (dos jefaturas con órdenes distintas) y autoridad proporcional a la responsabilidad (responde sin decidir).", "Unidad de dirección (falta un plan común) y remuneración (Daniela recibe un salario inferior al de otras personas).", "Estabilidad del personal (rota entre áreas) e iniciativa (a Daniela no se le permite proponer ideas a la gerencia)."], "answer": "1", "explanation": "La unidad de mando exige una sola jefatura por persona; y la responsabilidad debe ir acompañada de autoridad para decidir."}, {"id": 87, "area": 2, "topic": "Sectores económicos", "type": "select", "context": "Cuatro empresas: (1) una empresa de software que investiga inteligencia artificial, (2) una finca de piña, (3) una fábrica que convierte la piña en jugo, (4) una agencia de viajes.", "prompt": "¿Qué sector corresponde a cada una, en ese orden?", "options": ["Terciario, primario, secundario, cuaternario.", "Cuaternario, secundario, primario, terciario.", "Cuaternario, primario, secundario, terciario.", "Terciario, secundario, primario, cuaternario."], "answer": "2", "explanation": "El sector cuaternario se basa en conocimiento e investigación; el primario extrae; el secundario transforma; el terciario presta servicios."}, {"id": 88, "area": 2, "topic": "Instituciones", "type": "tf", "context": "Una microempresa está inscrita en Hacienda como contribuyente y emite facturas electrónicas, pero aún no ha registrado a su única empleada.", "prompt": "Como ya está inscrita en Hacienda, la microempresa también cumple con la inscripción patronal ante la CCSS.", "options": ["Verdadero", "Falso"], "answer": "1", "explanation": "Hacienda registra obligaciones tributarias; la CCSS registra al patrono y a sus trabajadores. Son trámites distintos."}, {"id": 89, "area": 2, "topic": "Triángulo del servicio", "type": "select", "context": "Una empresa de entregas capacita muy bien a su personal y atiende rápido a los clientes, pero no les da vehículos en buen estado ni un sistema para rastrear paquetes. Los repartidores se frustran y las quejas aumentan.", "prompt": "¿Qué vértice del triángulo del servicio está fallando principalmente?", "options": ["Los clientes, que deben aprender a esperar los tiempos de entrega aunque falten herramientas en la empresa.", "La empresa, que debe proporcionar recursos, herramientas y sistemas para que el personal pueda cumplir.", "El personal, que debe compensar con más esfuerzo la falta de vehículos y de un sistema de rastreo.", "Ninguno, porque con personal capacitado y atención rápida el triángulo está en equilibrio."], "answer": "1", "explanation": "La empresa debe dar políticas, recursos y tecnología; si falla, el personal no puede ofrecer buen servicio y el cliente se queja."}, {"id": 90, "area": 2, "topic": "Proceso y procedimiento", "type": "select", "context": "Una clínica dental tiene un «proceso de atención al paciente». Dentro de él, un documento indica: saludar, verificar la cita, tomar signos, pasar al consultorio y registrar el pago.", "prompt": "¿Cómo se denomina ese documento detallado y qué lo diferencia del proceso?", "options": ["Proceso: describe pasos específicos de una tarea; el procedimiento es el nombre del área que lo ejecuta.", "Organigrama: muestra quién debe ejecutar cada paso y quién responde ante la gerencia general de la clínica.", "Política: es una norma general que no incluye pasos y que reemplaza al proceso de atención en la clínica.", "Procedimiento: describe pasos específicos de una tarea; el proceso es el camino general que los incluye."], "answer": "3", "explanation": "El proceso es el camino general; el procedimiento detalla los pasos para ejecutar una tarea dentro de él."}, {"id": 91, "area": 2, "topic": "Estudios del plan", "type": "select", "context": "Un equipo se pregunta: «¿cuántas unidades podemos producir al mes con un solo horno, dónde conviene instalar el taller y cómo distribuimos las máquinas dentro del local?».", "prompt": "¿A qué estudio corresponden esas preguntas?", "options": ["Estudio de mercado, porque la capacidad de producción depende de cuántos clientes existan en la zona.", "Estudio financiero, porque decidir dónde instalar el taller es una decisión sobre el origen del dinero.", "Estudio técnico, porque define tamaño, localización y distribución física del proceso productivo.", "Estudio de mercadeo, porque la ubicación y el espacio de un local son decisiones de plaza y promoción."], "answer": "2", "explanation": "El estudio técnico responde cómo se produce: tamaño del proyecto, localización, ingeniería y distribución física."}, {"id": 92, "area": 2, "topic": "IVA", "type": "fill", "context": "Un servicio tiene un precio sin impuesto de ₡285 000. Se aplica el IVA de tarifa general del 13 %.", "prompt": "¿Cuánto es el monto del IVA, en colones? Escriba solo el número, sin puntos ni signo de colones.", "answer": "37050", "accepted": ["37050", "37 050", "37.050"], "explanation": "285 000 × 0,13 = 37 050."}, {"id": 93, "area": 2, "topic": "Póliza y exclusiones", "type": "select", "context": "Una empresa declaró ante el INS que sus trabajadores solo realizan labores de oficina. Un colaborador se lesiona operando una sierra eléctrica en la bodega, una tarea que no estaba declarada.", "prompt": "¿Cuál es la lectura más adecuada de la póliza?", "options": ["La póliza cubre cualquier lesión ocurrida en horario laboral, sin importar lo que se haya declarado al contratarla ni las condiciones.", "La póliza no cubre nada de lo ocurrido, porque los accidentes en bodegas son responsabilidad exclusiva de la CCSS y no del INS.", "Puede haber exclusión de cobertura, porque la actividad realizada no coincide con la declarada; conviene leer las condiciones y reportar pronto.", "La empresa debe pagar todo por su cuenta, porque la póliza de riesgos del trabajo solo cubre enfermedades y nunca accidentes laborales."], "answer": "2", "explanation": "La cobertura depende de las actividades y personas declaradas; declarar mal puede generar exclusiones y problemas al reclamar."}, {"id": 94, "area": 2, "topic": "Objetivo SMART", "type": "fill", "context": "Un negocio tiene 70 pedidos mensuales y quiere llegar a 90 en 5 meses, con un aumento igual cada mes.", "prompt": "¿Cuántos pedidos más debe lograr cada mes? Escriba solo el número.", "answer": "4", "accepted": ["4"], "explanation": "(90 − 70) ÷ 5 = 4 pedidos adicionales por mes."}, {"id": 95, "area": 2, "topic": "Objetivos SMART", "type": "tf", "context": "Un equipo escribe el objetivo: «Aumentar los pedidos de 70 a 90 por mes en 5 meses». Los 70 pedidos son su punto de partida actual.", "prompt": "Para medir el avance, el punto de partida (línea base) permite saber cuánto crecimiento se necesita en cada período.", "options": ["Verdadero", "Falso"], "answer": "0", "explanation": "Sin línea base no se puede evaluar si el aumento es suficiente; la meta se mide contra el punto de partida."}, {"id": 96, "area": 2, "topic": "Macro y microlocalización", "type": "select", "context": "Una empresa de turismo rural decide instalarse en Guanacaste por su potencial turístico y luego elige un terreno específico a 5 km de una playa, con acceso por carretera pavimentada y agua potable.", "prompt": "¿Qué decisiones corresponden a cada nivel de localización?", "options": ["Macrolocalización: la región (Guanacaste); microlocalización: el terreno específico con sus servicios y accesos.", "Macrolocalización: el terreno con agua y carretera; microlocalización: la provincia de Guanacaste.", "Ambas son microlocalización, porque Guanacaste y el terreno pertenecen al mismo estudio técnico del proyecto.", "Ambas son macrolocalización, porque se decide primero la región y después el terreno por sus costos."], "answer": "0", "explanation": "La macrolocalización elige región o provincia; la microlocalización, el sitio exacto y sus condiciones."}, {"id": 97, "area": 2, "topic": "Herramientas digitales", "type": "select", "context": "Una PYME de servicios quiere documentar paso a paso cómo facturar y atender reclamos, que todas las personas puedan editar los textos y que se conserve el historial de cambios.", "prompt": "¿Qué herramienta se ajusta mejor a esa necesidad?", "options": ["Un blog público, porque permite publicar textos con frecuencia y ayuda al posicionamiento en buscadores.", "Una red social, porque permite que el personal comente rápido cada paso y mejora la imagen de la marca.", "Una hoja de cálculo sin compartir, porque cada persona guarda su versión del procedimiento en su equipo.", "Una wiki interna, porque permite documentar procedimientos de forma colaborativa y guarda el historial de versiones."], "answer": "3", "explanation": "Una wiki sirve para conocimiento interno colaborativo, con control de versiones; el blog es para público externo."}, {"id": 98, "area": 2, "topic": "Orden de trámites", "type": "select", "context": "Un grupo quiere abrir una soda. Tiene el contrato de alquiler y una póliza de riesgos del trabajo vigente del INS, pero la municipalidad no les ha dado ningún permiso. Acuden primero a solicitar la patente.", "prompt": "¿Qué ocurrirá y cuál es el orden adecuado?", "options": ["La obtendrán, porque con el contrato de alquiler y la póliza del INS la municipalidad puede otorgar la patente de inmediato.", "No podrán obtenerla: la patente se otorga al final; primero necesitan uso de suelo y luego el permiso sanitario con póliza vigente.", "No podrán obtenerla, y deben pedir antes el permiso sanitario y solo después tramitar el uso de suelo en la municipalidad.", "La obtendrán, porque la patente es el primer trámite y el uso de suelo y el permiso sanitario se solicitan después de operar."], "answer": "1", "explanation": "La patente exige uso de suelo aprobado, permiso sanitario si aplica y póliza vigente; por eso es el último paso municipal."}, {"id": 99, "area": 2, "topic": "Cadena de valor", "type": "select", "context": "Una fábrica de chocolate considera: (1) recibir y almacenar el cacao, (2) tostar y moldear, (3) entregar a supermercados, (4) capacitar al personal, (5) atender reclamos después de la venta.", "prompt": "¿Cuáles son actividades de apoyo, según la cadena de valor de Porter?", "options": ["Las actividades 1 y 3, porque la logística de entrada y salida no producen directamente el chocolate terminado.", "Las actividades 2 y 5, porque tostar, moldear y atender reclamos son parte de la infraestructura de la empresa.", "Solo la 4, capacitar al personal, que corresponde a la gestión de recursos humanos.", "Las actividades 1, 2 y 3, porque transforman la materia prima y no tienen relación con el cliente."], "answer": "2", "explanation": "Las actividades primarias van del insumo al cliente (logística, operaciones, ventas, postventa); las de apoyo las sostienen, como recursos humanos."}, {"id": 100, "area": 2, "topic": "Asociatividad, encadenamiento y clúster", "type": "select", "context": "Cinco panaderías de un cantón compran harina juntas para obtener mejor precio, pero cada una conserva su cédula jurídica, su marca y sus decisiones internas.", "prompt": "¿Cómo se clasifica esa colaboración?", "options": ["Fusión empresarial, porque al comprar en conjunto pasan a funcionar como una sola empresa con una única administración.", "Encadenamiento productivo, porque cada panadería agrega valor a la anterior en una secuencia ordenada de eslabones.", "Asociatividad empresarial, porque se unen voluntariamente con objetivos comunes y mantienen su independencia jurídica.", "Clúster tecnológico, porque están en el mismo cantón y todas fabrican un producto que se basa en la tecnología."], "answer": "2", "explanation": "La asociatividad se basa en voluntariedad, independencia jurídica y objetivos comunes, como comprar en volumen."}], "areas": ["Oportunidades de negocios", "Modelo de negocios", "Creación de empresas"]}</script>

const $=s=>document.querySelector(s), root=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase().replace(/\s+/g,' ');
const correct=(q,v)=>typeof v==='string'&&(q.accepted||[q.answer]).some(a=>norm(a)===norm(v));
const grade=a=>QUESTIONS.reduce((n,q)=>n+Number(correct(q,a[q.id])),0);
const count=a=>QUESTIONS.filter(q=>String(a[q.id]??'').trim()).length;
const date=v=>new Date(v).toLocaleString('es-CR',{timeZone:'America/Costa_Rica',dateStyle:'short',timeStyle:'short'});
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
let db={version:1,students:{},attempts:[]}, user=null, screen='login',pos=0,selectedReport=null,errorsOnly=true,storageOK=true, saveMessage='',filterGroup='',filterText='';

let syncTimer=null;
function payload(a){const st=db.students[a.studentId],done=a.status==='completed',ar=AREAS.map((_,i)=>QUESTIONS.filter(q=>q.area===i&&correct(q,a.answers[q.id])).length);let resp=done?JSON.stringify(a.answers):'';if(resp.length>11000)resp='';return {action:'save',intento:a.id,cedula:st.id,nombre:st.first,apellidos:st.last,seccion:st.group,estado:a.status,respondidas:count(a.answers),nota:done?a.score:'',inicio:a.started,actualizado:a.updated,finalizado:a.completed||'',area1:ar[0]||0,area2:ar[1]||0,area3:ar[2]||0,aciertos:QUESTIONS.map(q=>correct(q,a.answers[q.id])?1:0).join(''),respuestas:resp};}
function syncNow(a){if(!SYNC_URL||!a||!db.students[a.studentId])return;clearTimeout(syncTimer);syncTimer=null;a.dirty=true;try{fetch(SYNC_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload(a))}).then(()=>{a.dirty=false;try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}}).catch(()=>{});}catch(e){}}

const btn=(label,action,extra='')=>`<button class="btn" data-action="${action}" ${extra}>${label}</button>`;
