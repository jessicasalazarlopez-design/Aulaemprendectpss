<style>
:root{color-scheme:light;--green:#176b59;--dark:#123f36;--ink:#233c35;--muted:#536b61;--line:#dce5dc;--paper:#f6f8f2;--pale:#eaf2e6;--gold:#f2cf65}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.6 system-ui,-apple-system,'Segoe UI',sans-serif}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #bf8f26;outline-offset:3px}a{color:var(--green)}header{background:#fff;border-bottom:1px solid var(--line);padding:15px max(22px,calc((100vw - 1180px)/2));display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-weight:800;font-size:23px;color:var(--dark);line-height:1.15}.brand small{display:block;font-size:12px;letter-spacing:1.4px;margin-top:6px}nav,.actions,.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}main{max-width:1180px;margin:auto;padding:34px 24px 64px}h1{font-size:clamp(29px,4vw,46px);line-height:1.15;letter-spacing:-1.1px;color:var(--dark);margin:19px 0}h2{font-size:27px;line-height:1.3;margin:0 0 16px;color:var(--dark)}h3{font-size:21px;line-height:1.35;margin:0 0 12px}p{margin:0 0 16px}.muted,small{color:var(--muted)}small{font-size:15px}.eyebrow{font-size:13px;letter-spacing:1.4px;font-weight:800;color:var(--green);text-transform:uppercase}.lead{font-size:20px;max-width:820px;color:var(--muted)}.identity{display:flex;gap:19px;align-items:center}.identity img{width:70px;height:70px;object-fit:contain}.identity p{font-size:16px;margin:5px 0}.notice{border-left:4px solid #c09d3b;background:#fff8dc;padding:14px 18px;margin:22px 0;border-radius:0 9px 9px 0;font-size:16px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:26px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:28px 0}.hero{background:var(--dark);color:#fff;padding:32px;border-radius:17px}.hero h2{color:#fff;font-size:34px}.hero p{color:#d2e6d5}.pill{display:inline-block;background:var(--pale);color:var(--green);font-size:13px;font-weight:800;padding:5px 11px;border-radius:20px}.hero .pill{background:#ffffff16;color:#d1efc5}.area-row{padding:16px 0;border-bottom:1px solid #ffffff20;font-size:19px}.area-row small{color:#b8dac4;display:block}.btn{border:1px solid var(--line);border-radius:9px;background:white;color:var(--dark);padding:11px 17px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;font-size:16px;line-height:1.5}.primary{background:var(--green);border-color:var(--green);color:#fff}.light{background:#d3efc2;color:var(--dark);border-color:#d3efc2}.danger{color:#8b3931}.wide{width:100%}.textbtn{background:none;border:0;color:var(--green);font-size:16px;font-weight:700;padding:8px 0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:16px;font-weight:700;margin-bottom:15px}input,select{width:100%;border:1px solid #bfcfc4;background:#fff;padding:12px 13px;border-radius:8px;color:var(--ink);margin-top:6px}input[type=checkbox],input[type=radio]{width:auto;margin:0;accent-color:var(--green)}label.check{display:flex;align-items:center;gap:9px}progress{width:100%;height:15px;accent-color:var(--green)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:24px 0}.metric strong{display:block;font-size:34px;color:var(--green)}.metric small{display:block}.banner{background:var(--dark);padding:30px;border-radius:16px;color:white;display:flex;justify-content:space-between;align-items:center;gap:20px}.banner h2{color:white;margin-top:12px}.banner p{color:#d5e8d6}.banner .progress{flex:1}.history{width:100%;border-collapse:collapse;margin-top:16px}th,td{text-align:left;padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:16px}th{background:var(--pale)}.tablewrap{overflow:auto}.quiz-layout{display:grid;grid-template-columns:245px 1fr;gap:24px;margin-top:20px}.map{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:18px 0}.map button{font-size:14px;font-weight:700;padding:6px 0;min-height:35px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--muted)}.map .answered{background:#dcebd7;color:var(--dark);border-color:#b5d3ab}.map .flagged{box-shadow:inset 0 -4px var(--gold)}.map .current{outline:2px solid var(--green);outline-offset:1px}.question-top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px;font-size:15px}.context{border-left:4px solid #b9d7b1;background:var(--paper);padding:18px 22px;border-radius:0 10px 10px 0;margin-bottom:24px;font-size:19px}.question h2{font-size:25px;line-height:1.4}.options{border:0;padding:0;margin:24px 0}.option{display:flex;gap:14px;align-items:flex-start;padding:17px;border:1px solid var(--line);border-radius:10px;margin:12px 0;font-weight:400;font-size:18px;cursor:pointer}.option.selected{background:#eff6e9;border-color:var(--green)}.option input{margin-top:6px}.letter{font-size:15px;font-weight:800;background:var(--pale);border-radius:5px;padding:2px 7px}.between{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.q-nav{margin-top:20px}.save-status{color:var(--green);font-size:15px;margin:6px 0}.error{background:#fff0ed;color:#8f3029;padding:13px 17px;border-radius:9px;margin:16px 0;white-space:pre-line}.results-title{font-size:54px;font-weight:800;line-height:1.1}.review{margin:18px 0;border-left:5px solid #c78d64}.review.correct{border-left-color:#80b270}.explanation{background:var(--pale);padding:16px;border-radius:8px}.review .context{font-size:17px;margin-top:16px}.answer-row{display:grid;grid-template-columns:1fr 1fr;gap:18px}.answer-row p{font-size:17px}.review h3{font-size:20px}footer{padding-top:25px;margin-top:30px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}dialog{max-width:560px;width:calc(100% - 32px);border:1px solid var(--line);border-radius:18px;padding:28px;color:var(--ink);background:var(--paper)}dialog::backdrop{background:#0c2c2588}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.empty{padding:25px;text-align:center;color:var(--muted)}.score{font-size:25px;font-weight:800;color:var(--green)}@media(max-width:800px){header{padding:15px 18px;align-items:flex-start}.brand{font-size:20px}nav{gap:6px}nav .btn{padding:8px 10px;font-size:14px}main{padding:25px 16px 45px}.layout,.quiz-layout{grid-template-columns:1fr}.map{grid-template-columns:repeat(10,1fr)}.quiz-layout aside{order:2}.banner{display:block}.banner .btn{margin-top:10px}.metrics{gap:9px}.metric{padding:17px 12px}.metric strong{font-size:27px}.metric h3{font-size:18px}.hero{padding:25px}}@media(max-width:480px){.fields,.answer-row{grid-template-columns:1fr}.card{padding:21px 17px}.metrics{grid-template-columns:1fr}.metric{padding:18px}.identity{gap:13px}.identity img{width:57px;height:57px}.identity .eyebrow{font-size:11px}.question h2{font-size:23px}.context{padding:15px;font-size:18px}.option{padding:14px;gap:10px}.map{grid-template-columns:repeat(10,1fr);gap:5px}.map button{font-size:12px}}@media print{header,.no-print,dialog,.notice{display:none!important}body{font-size:12px;background:white}main{padding:0;max-width:none}.card,.banner{break-inside:avoid}.review{page-break-inside:avoid}.metrics{grid-template-columns:repeat(3,1fr)}.banner{color:#173e36;background:#f2f6ef}.banner h2,.banner p{color:#173e36}.review .context,.explanation{font-size:12px}.review h3{font-size:14px}h1{font-size:26px}a{color:inherit}}
</style></head><body>
