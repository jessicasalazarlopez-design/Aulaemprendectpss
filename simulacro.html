function teacherViewLocal(){const students=Object.values(db.students).filter(s=>(!filterGroup||s.group===filterGroup)&&norm(s.first+' '+s.last+' '+s.id).includes(norm(filterText))),ids=new Set(students.map(s=>s.id)),attempts=db.attempts.filter(a=>ids.has(a.studentId)),done=attempts.filter(a=>a.status==='completed');return `<div class="eyebrow">Consulta local · docente</div><h1>Una mirada a este navegador.</h1><p class="lead">Resultados de las prácticas realizadas y guardadas en este navegador.</p><div class="notice"><b>Este panel local no está protegido y no recibe resultados de otros equipos.</b> No guardés datos reales de estudiantes en equipos compartidos sin la gestión correspondiente del colegio.</div><section class="card"><div class="fields"><label>Buscar por nombre o cédula<input id="teacher-search" value="${esc(filterText)}" placeholder="Nombre o cédula"></label><label>Sección<select id="teacher-group"><option value="">Todas</option>${[...new Set(Object.values(db.students).map(s=>s.group))].sort().map(g=>`<option ${g===filterGroup?'selected':''}>${esc(g)}</option>`).join('')}</select></label></div><div class="actions">${btn('Aplicar filtros','filter')}${btn('Descargar CSV local','csv')}</div></section><div class="metrics"><div class="card metric"><small>Estudiantes en este navegador</small><strong>${students.length}</strong></div><div class="card metric"><small>Intentos finalizados</small><strong>${done.length}</strong></div><div class="card metric"><small>Nota promedio</small><strong>${done.length?Math.round(done.reduce((n,a)=>n+a.score,0)/done.length*10)/10:'—'}</strong></div></div><section class="card tablewrap"><table class="history"><thead><tr><th>Estudiante</th><th>Sección</th><th>Avance</th><th>Resultados</th></tr></thead><tbody>${students.map(s=>{const own=attempts.filter(a=>a.studentId===s.id),a=own.find(t=>t.status==='active');return `<tr><td><b>${esc(s.first)} ${esc(s.last)}</b><br><small>${esc(s.id)}</small></td><td>${esc(s.group)}</td><td>${a?co  const ids=new Set(list.map(x=>x.id)),doneAll=all.filter(a=>a.estado==='completed'&&ids.has(a.cedula)),tot=AREAS.map((_,i)=>QUESTIONS.filter(q=>q.area===i).length);
 const areaPct=AREAS.map((_,i)=>{const b=withDone.map(x=>x.bestRow).filter(Boolean);return b.length?Math.round(b.reduce((n,a)=>n+(Number(a['area'+(i+1)])||0),0)/b.length/tot[i]*100):null;});
 const qs=QUESTIONS.map((q,i)=>{const v=doneAll.filter(a=>a.aciertos.length===QUESTIONS.length);return {q,pct:v.length?Math.round(v.reduce((n,a)=>n+Number(a.aciertos[i]),0)/v.length*100):null,n:v.length};}).filter(x=>x.pct!==null).sort((a,b)=>a.pct-b.pct).slice(0,10);
 const groups=[...new Set(dashRows().map(a=>String(a.seccion)))].sort();
 return `<div class="between"><div><div class="eyebrow">Panel docente</div><h1 style="margin-bottom:6px">Resultados del simulacro</h1><small>Actualizado ${esc(date(dash.when))}</small></div><div class="actions">${btn(dash.loading?'Actualizando…':'Actualizar','dash-load')}${btn('Salir','dash-out')}</div></div>
 <section class="card" style="margin-top:20px"><div class="fields"><label>Buscar por nombre o cédula<input id="teacher-search" value="${esc(filterText)}"></label><label>Sección<select id="teacher-group"><option value="">Todas</option>${groups.map(g=>`<option ${g===filterGroup?'selected':''}>${esc(g)}</option>`).join('')}</select></label><label>Nota mínima para aprobar<input id="dash-pass" type="number" min="1" max="100" value="${pass}"></label></div><div class="actions">${btn('Aplicar','dash-apply')}${btn('Descargar CSV','dash-csv')}</div></section>
 <div class="metrics"><div class="card metric"><small>Estudiantes registrados</small><strong>${list.length}</strong></div><div class="card metric"><small>Terminaron</small><strong>${withDone.length}</strong></div><div class="card metric"><small>En progreso</small><strong>${inprog.length}</strong></div><div class="card metric"><small>Aprueban (≥ ${pass})</small><strong>${passed.length}</strong><small>${withDone.length?Math.round(passed.length/withDone.length*100)+' % de quienes terminaron':'—'}</small></div><div class="card metric"><small>No aprueban (&lt; ${pass})</small><strong>${withDone.length-passed.length}</strong><small>${withDone.length?Math.round((withDone.length-passed.length)/withDone.length*100)+' % de quienes terminaron':'—'}</small></div><div class="card metric"><small>Nota promedio (mejor intento)</small><strong>${avg??'—'}</strong></div></div>
 <div class="metrics">${AREAS.map((n,i)=>`<section class="card metric"><h3>${esc(n)}</h3><strong>${areaPct[i]===null?'—':areaPct[i]+'%'}</strong><small>promedio de aciertos</small></section>`).join('')}</div>
 <section class="card tablewrap"><h3>Análisis por sección</h3><p class="muted">Compara los grupos con la mejor nota de cada estudiante que terminó. La columna de aprobación usa la nota mínima de arriba.</p><table class="history"><thead><tr><th>Sección</th><th>Estudiantes</th><th>Terminaron</th><th>Aprueban</th><th>Promedio</th>${AREAS.map(n=>`<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>${sectionStats(pass).map(x=>`<tr><td><b>${esc(x.g)}</b></td><td>${x.n}</td><td>${x.done}</td><td class="score">${x.pass===null?'—':x.pass+' %'}</td><td class="score">${x.avg===null?'—':x.avg}</td>${x.ar.map(v=>`<td class="score">${v===null?'—':v+' %'}</td>`).join('')}</tr>`).join('')}</tbody></table>${sectionStats(pass).length?'':'<p class="empty">Aparecerá cuando haya estudiantes registrados.</p>'}</section>
 <section class="card tablewrap"><h3>Estudiantes</h3><table class="history"><thead><tr><th>Estudiante</th><th>Sección</th><th>Estado</th><th>Mejor nota</th><th>Resultado</th><th>Intentos</th><th>Última actividad</th></tr></thead><tbody>${list.map(x=>`<tr><td><b>${esc(x.name)}</b><br><small>${esc(x.id)}</small></td><td>${esc(x.group)}</td><td>${x.act?'En progreso: '+x.act.respondidas+'/100':x.done?'Terminó':'—'}</td><td class="score">${x.best===null?'—':x.best+'/100'}</td><td>${x.best===null?'Pendiente':x.best>=pass?'Aprueba':'No aprueba'}</td><td>${x.intentos}</td><td>${esc(date(x.last))}</td></tr>`).join('')}</tbody></table>${list.length?'':'<p class="empty">Aún no hay estudiantes o no hay coincidencias.</p>'}</section>
 <section class="card tablewrap"><h3>Las 10 preguntas con menos aciertos</h3><p class="muted">Para decidir qué reforzar en clase (calculado con los intentos terminados).</p><table class="history"><thead><tr><th>#</th><th>Tema</th><th>Aciertos</th></tr></thead><tbody>${qs.map(x=>`<tr><td>${x.q.id}</td><td>${esc(x.q.topic)}</td><td class="score">${x.pct} %</td></tr>`).join('')}</tbody></table>${qs.length?'':'<p class="empty">Aparecerá cuando haya intentos terminados.</p>'}</section>`;}
async function dashLoad(){dash.loading=true;dash.err='';render();try{const res=await fetch(SYNC_URL+'?action=list&key='+encodeURIComponent(dash.key),{cache:'no-store'});const j=await res.json();if(!j.ok){dash.err=j.error==='clave'?'Clave incorrecta.':'No se pudo leer la información.';dash.rows=null;}else{dash.rows=j;dash.when=Date.now();}}catch(e){dash.err='No se pudo conectar. Revisá tu conexión e intentá de nuevo.';dash.rows=null;}dash.loading=false;render();}
function dashCsv(){const {list}=dashData(),pass=Number(dash.pass)||80,cell=v=>'"'+String(v).replace(/^[=+@-]/,"'").replace(/"/g,'""')+'"';const rows=[['Cedula','Nombre','Seccion','Estado','Respondidas','Mejor nota','Resultado','Intentos'],...list.map(x=>[x.id,x.name,x.group,x.act?'En progreso':x.done?'Terminó':'',x.act?x.act.respondidas:'',x.best??'',x.best===null?'Pendiente':x.best>=pass?'Aprueba':'No aprueba',x.intentos])];download('resultados-simulacro.csv','﻿'+rows.map(r=>r.map(cell).join(';')).join('\r\n'),'text/csv;charset=utf-8');}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(a==='dash-load'){const k=$('#dash-key');if(k)dash.key=k.value;if(!dash.key){dash.err='Ingresá la clave.';render();return;}dashLoad();}if(a==='dash-out'){dash.key='';dash.rows=null;go('login');}if(a==='dash-apply'){filterText=$('#teacher-search').value;filterGroup=$('#teacher-group').value;dash.pass=$('#dash-pass').value;render();}if(a==='dash-csv'){dash.pass=$('#dash-pass').value;dashCsv();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='dash-key'){dash.key=e.target.value;dashLoad();}});

render();
</script><script>
/* Botón «Ver» para mostrar u ocultar contraseñas */
(function(){
function enhance(root){root.querySelectorAll('input[type=password]:not([data-pw])').forEach(function(i){
 i.dataset.pw='1';var w=document.createElement('span');w.style.cssText='position:relative;display:block';
 i.parentNode.insertBefore(w,i);w.appendChild(i);i.style.paddingRight='76px';
 var b=document.createElement('button');b.type='button';b.textContent='Ver';b.setAttribute('aria-label','Mostrar contraseña');b.setAttribute('aria-pressed','false');
 b.style.cssText='position:absolute;right:6px;top:50%;transform:translateY(-50%);min-height:34px;padding:0 12px;border:1px solid #b9c9bf;border-radius:8px;background:#fff;color:#123f36;font:600 .85rem inherit;cursor:pointer';
 b.addEventListener('click',function(){var s=i.type==='password';i.type=s?'text':'password';b.textContent=s?'Ocultar':'Ver';b.setAttribute('aria-label',s?'Ocultar contraseña':'Mostrar contraseña');b.setAttribute('aria-pressed',String(s));i.focus();});
 w.appendChild(b);});}
function go(){enhance(document);}
new MutationObserver(go).observe(document.documentElement,{childList:true,subtree:true});
if(document.readyState!=='loading')go();else document.addEventListener('DOMContentLoaded',go);
})();
</script>
