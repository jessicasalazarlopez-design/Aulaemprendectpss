<style>

ding:32px;border-radius:17px}.hero h2{color:#fff;font-size:34px}.hero p{color:#d2e6d5}.pill{display:inline-block;background:var(--pale);color:var(--green);font-size:13px;font-weight:800;padding:5px 11px;border-radius:20px}.hero .pill{background:#ffffff16;color:#d1efc5}.area-row{padding:16px 0;border-bottom:1px solid #ffffff20;font-size:19px}.area-row small{color:#b8dac4;display:block}.btn{border:1px solid var(--line);border-radius:9px;background:white;color:var(--dark);padding:11px 17px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;font-size:16px;line-height:1.5}.primary{background:var(--green);border-color:var(--green);color:#fff}.light{background:#d3efc2;color:var(--dark);border-color:#d3efc2}.danger{color:#8b3931}.wide{width:100%}.textbtn{background:none;border:0;color:var(--green);font-size:16px;font-weight:700;padding:8px 0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:16px;font-weight:700;margin-bottom:15px}input,select{width:100%;border:1px solid #bfcfc4;background:#fff;padding:12px 13px;border-radius:8px;color:var(--ink);margin-top:6px}input[type=checkbox],input[type=radio]{width:auto;margin:0;accent-color:var(--green)}label.check{display:flex;align-items:center;gap:9px}progress{width:100%;height:15px;accent-color:var(--green)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:24px 0}.metric strong{display:block;font-size:34px;color:var(--green)}.metric small{display:block}.banner{background:var(--dark);padding:30px;border-radius:16px;color:white;display:flex;justify-content:space-between;align-items:center;gap:20px}.banner h2{color:white;margin-top:12px}.banner p{color:#d5e8d6}.banner .progress{flex:1}.history{width:100%;border-collapse:collapse;margin-top:16px}th,td{text-align:left;padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:16px}th{background:var(--pale)}.tablewrap{overflow:auto}.quiz-layout{display:grid;grid-template-columns:245px 1fr;gap:24px;margin-top:20px}.map{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:18px 0}.map button{font-size:14px;font-weight:700;padding:6px 0;min-height:35px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--muted)}.map .answered{background:#dcebd7;color:var(--dark);border-color:#b5d3ab}.map .flagged{box-shadow:inset 0 -4px var(--gold)}.map .current{outline:2px solid var(--green);outline-offset:1px}.question-top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px;font-size:15px}.context{border-left:4px solid #b9d7b1;background:var(--paper);padding:18px 22px;border-radius:0 10px 10px 0;margin-bottom:24px;font-size:19px}.question h2{font-size:25px;line-height:1.4}.options{border:0;padding:0;margin:24px 0}.option{display:flex;gap:14px;align-items:flex-start;padding:17px;border:1px solid var(--line);border-radius:10px;margin:12px 0;font-weight:400;font-size:18px;cursor:pointer}.option.selected{background:#eff6e9;border-color:var(--green)}.option input{margin-top:6px}.letter{font-size:15px;font-weight:800;background:var(--pale);border-radius:5px;padding:2px 7px}.between{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.q-nav{margin-top:20px}.save-status{color:var(--green);font-size:15px;margin:6px 0}.error{background:#fff0ed;color:#8f3029;padding:13px 17px;border-radius:9px;margin:16px 0;white-space:pre-line}.results-title{font-size:54px;font-weight:800;line-height:1.1}.review{margin:18px 0;border-left:5px solid #c78d64}.review.correct{border-left-color:#80b270}.explanation{background:var(--pale);padding:16px;border-radius:8px}.review .context{font-size:17px;margin-top:16px}.answer-row{display:grid;grid-template-columns:1fr 1fr;gap:18px}.answer-row p{font-size:17px}.review h3{font-size:20px}footer{padding-top:25px;margin-top:30px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}dialog{max-width:560px;width:calc(100% - 32px);border:1px solid var(--line);border-radius:18px;padding:28px;color:var(--ink);background:var(--paper)}dialog::backdrop{background:#0c2c2588}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.empty{padding:25px;text-align:center;color:var(--muted)}.score{font-size:25px;font-weight:800;color:var(--green)}@media(max-width:800px){header{padding:15px 18px;align-items:flex-start}.brand{font-size:20px}nav{gap:6px}nav .btn{padding:8px 10px;font-size:14px}main{padding:25px 16px 45px}.layout,.quiz-layout{grid-template-columns:1fr}.map{grid-template-columns:repeat(10,1fr)}.quiz-layout aside{order:2}.banner{display:block}.banner .btn{margin-top:10px}.metrics{gap:9px}.metric{padding:17px 12px}.metric strong{font-size:27px}.metric h3{font-size:18px}.hero{padding:25px}}@media(max-width:480px){.fields,.answer-row{grid-template-columns:1fr}.card{padding:21px 17px}.metrics{grid-template-columns:1fr}.metric{padding:18px}.identity{gap:13px}.identity img{width:57px;height:57px}.identity .eyebrow{font-size:11px}.question h2{font-size:23px}.context{padding:15px;font-size:18px}.option{padding:14px;gap:10px}.map{grid-template-columns:repeat(10,1fr);gap:5px}.map button{font-size:12px}}@media print{header,.no-print,dialog,.notice{display:none!important}body{font-size:12px;background:white}main{padding:0;max-width:none}.card,.banner{break-inside:avoid}.review{page-break-inside:avoid}.metrics{grid-template-columns:repeat(3,1fr)}.banner{color:#173e36;background:#f2f6ef}.banner h2,.banner p{color:#173e36}.review .context,.explanation{font-size:12px}.review h3{font-size:14px}h1{font-size:26px}a{color:inherit}}
</style></head><body>

<script type="application/json" id="bank">{"questions": [{"id": 1, "area": 0, "topic": "Espíritu emprendedor", "type": "select", "context": "Una estudiante identifica que personas mayores del barrio no pueden retirar sus medicamentos. Antes de ofrecer entregas, conversa con ellas y con la farmacia.", "prompt": "¿Qué acción expresa mejor una conducta emprendedora responsable?", "options": ["Comprar una motocicleta antes de conocer la demanda.", "Validar la necesidad, analizar riesgos y diseñar un servicio viable.", "Copiar la tarifa de otro negocio sin estimar costos.", "Prometer entregas inmediatas sin verificar capacidad."], "answer": "1", "explanation": "Emprender implica convertir una necesidad en una propuesta viable, con iniciativa, validación y responsabilidad por sus riesgos."}, {"id": 2, "area": 0, "topic": "Habilidades y responsabilidades", "type": "select", "context": "El equipo de EcoLonchera recibe quejas por entregas tardías. Su gerente propone ocultarlas para conservar la reputación.", "prompt": "¿Qué alternativa combina liderazgo y responsabilidad?", "options": ["Responsabilizar al cliente por comprar en hora pico.", "Eliminar los comentarios sin cambiar la operación.", "Analizar causas con el equipo, acordar mejoras e informar al cliente.", "Ofrecer descuentos permanentes sin revisar las causas."], "answer": "2", "explanation": "El liderazgo responsable escucha, coordina acciones y rinde cuentas; ocultar información impide aprender y corregir."}, {"id": 3, "area": 0, "topic": "Proyecto de vida", "type": "select", "context": "Andrés estudia electrónica, tiene cuatro horas libres por semana y desea pagar sus estudios con un servicio de reparación.", "prompt": "¿Qué decisión articula mejor el emprendimiento con su proyecto de vida?", "options": ["Definir servicios y metas compatibles con su formación y tiempo disponible.", "Aceptar cualquier reparación para maximizar ventas inmediatas.", "Abandonar sus estudios antes de probar la demanda.", "Invertir todos sus ahorros en inventario de baja rotación."], "answer": "0", "explanation": "El proyecto debe responder a metas personales y capacidades reales, sin ignorar recursos, tiempo ni formación."}, {"id": 4, "area": 0, "topic": "Justificación del proyecto", "type": "select", "context": "Un grupo propone vender filtros de agua. Solo afirma que «es una idea bonita»; no describe usuarios ni evidencia de la necesidad.", "prompt": "¿Qué información fortalecería más la justificación?", "options": ["Un logotipo llamativo y un eslogan breve.", "El nombre de todos los integrantes del equipo.", "Una lista de colores para el empaque.", "Datos sobre el problema de los usuarios, su magnitud y el beneficio de resolverlo."], "answer": "3", "explanation": "La justificación explica por qué vale la pena el proyecto, qué problema atiende y a quién beneficia, respaldada con evidencia."}, {"id": 5, "area": 0, "topic": "Análisis integral", "type": "select", "context": "Una aplicación tiene demanda potencial y buena aceptación, pero el costo de mantenerla supera los ingresos previstos y requiere datos sensibles.", "prompt": "¿Qué conclusión es más sólida?", "options": ["La aceptación vuelve innecesario el análisis financiero.", "Debe revisarse su viabilidad económica y la gestión ética de datos antes de escalar.", "Basta con aumentar la publicidad para asegurar la viabilidad.", "El proyecto debe lanzarse porque incorpora tecnología."], "answer": "1", "explanation": "El análisis integral relaciona mercado, capacidad técnica, finanzas y efectos sociales; una sola señal favorable no demuestra viabilidad."}, {"id": 6, "area": 0, "topic": "Uso productivo de tecnologías", "type": "select", "context": "Una panadería usa redes sociales para publicar fotos, pero desconoce qué pedidos se convierten en ventas.", "prompt": "¿Qué uso tecnológico aportaría más a la gestión?", "options": ["Publicar el mismo mensaje cada hora.", "Comprar seguidores para aumentar el alcance aparente.", "Vincular pedidos, inventario y ventas para analizar conversión y desperdicio.", "Elegir únicamente la plataforma con más efectos visuales."], "answer": "2", "explanation": "La tecnología es productiva cuando mejora procesos o decisiones; medir pedidos, ventas y desperdicio permite actuar sobre resultados."}, {"id": 7, "area": 0, "topic": "Dinámica del mercado", "type": "select", "context": "Sube el precio de los empaques y varios restaurantes buscan opciones reutilizables. Un equipo detecta nuevos proveedores y hábitos de consumo.", "prompt": "¿Qué interpretación del mercado resulta más completa?", "options": ["Cambios en costos, oferta y preferencias pueden crear oportunidades que deben validarse.", "Toda subida de costos genera automáticamente un negocio rentable.", "El mercado depende exclusivamente de lo que desee producir la empresa.", "Las preferencias del cliente son constantes si el producto es conocido."], "answer": "0", "explanation": "El mercado es dinámico: interactúan oferentes, compradores y condiciones del entorno. Una oportunidad requiere comprobar demanda y viabilidad."}, {"id": 8, "area": 0, "topic": "Análisis del entorno", "type": "select", "context": "Un servicio de entregas registra nuevas rutas de autobús, crecimiento de oficinas y aumento del costo del combustible.", "prompt": "¿Cómo debería utilizar estos datos?", "options": ["Excluir los cambios externos porque no puede controlarlos.", "Mantener su plan sin cambios hasta perder clientes.", "Usar solamente el dato que favorezca su propuesta.", "Analizar cómo modifican demanda, accesibilidad y costos de operación."], "answer": "3", "explanation": "El entorno aporta oportunidades y amenazas. Relacionar sus cambios con la operación permite anticipar ajustes."}, {"id": 9, "area": 0, "topic": "Necesidades sociales", "type": "select", "context": "Un equipo observa estudiantes que no almuerzan por restricciones de tiempo. Aún no sabe si la causa principal es precio, horario o ubicación.", "prompt": "¿Qué paso conviene realizar antes de definir el producto?", "options": ["Diseñar un menú extenso para cubrir todas las posibilidades.", "Investigar con estudiantes y observar el contexto para precisar la necesidad.", "Elegir la causa que resulte más fácil de resolver.", "Suponer que todos prefieren el mismo tipo de comida."], "answer": "1", "explanation": "Investigar el problema evita construir una solución sobre supuestos no comprobados."}, {"id": 10, "area": 0, "topic": "Recolección de información", "type": "select", "context": "Se quiere evaluar interés por un servicio de tutorías en todo el colegio. El equipo encuesta únicamente a sus cinco mejores amistades.", "prompt": "¿Cuál es la principal debilidad del estudio?", "options": ["La encuesta contiene preguntas y no observaciones.", "Cinco respuestas permiten describir a todo el colegio sin restricciones.", "La selección por cercanía puede sesgar los resultados y limita su generalización.", "Los estudiantes nunca pueden aportar información de mercado."], "answer": "2", "explanation": "Una muestra de conveniencia muy pequeña no representa necesariamente a los clientes potenciales del colegio."}, {"id": 11, "area": 0, "topic": "Diseño de instrumentos", "type": "select", "context": "Un equipo pregunta: «¿Verdad que nuestro excelente producto ecológico es mejor que los demás?».", "prompt": "¿Qué cambio mejora la calidad de la información?", "options": ["Preguntar qué atributos valora al comprar y qué alternativas utiliza actualmente.", "Agregar más adjetivos favorables al producto.", "Mostrar solo respuestas positivas.", "Preguntar únicamente si le gusta el nombre."], "answer": "0", "explanation": "Una pregunta neutral permite conocer necesidades y criterios sin inducir una respuesta favorable."}, {"id": 12, "area": 0, "topic": "Interpretación de resultados", "type": "select", "context": "De 120 personas encuestadas, 84 dicen que les gusta una botella, pero solo 18 dejan una reserva pagada al precio propuesto.", "prompt": "¿Qué inferencia es la más prudente?", "options": ["Las 84 personas comprarán con seguridad.", "La reserva prueba que el negocio ya es rentable.", "Debe ignorarse el dato de reservas porque es menor.", "El interés declarado es mayor que la evidencia de compra; falta estudiar conversión y costos."], "answer": "3", "explanation": "Decir que gusta un producto no equivale a pagarlo. Una reserva aporta evidencia conductual, pero no demuestra por sí sola rentabilidad."}, {"id": 13, "area": 0, "topic": "Cliente potencial", "type": "select", "context": "Una empresa ofrece software de inventario para pequeños talleres. Tiene recursos limitados para su primer lanzamiento.", "prompt": "¿Qué segmentación facilita validar la oportunidad?", "options": ["Todas las personas que usan Internet.", "Talleres pequeños con pérdidas de inventario y capacidad de pagar la solución.", "Cualquier empresa, sin distinguir su problema.", "Seguidores de una cuenta popular, aunque no administren talleres."], "answer": "1", "explanation": "Un segmento útil combina una necesidad específica, características observables y posibilidad de adopción o compra."}, {"id": 14, "area": 0, "topic": "Fuentes de ideas", "type": "select", "context": "Un estudiante observa largas filas, escucha a usuarios y revisa soluciones de otros sectores. Combina pedidos anticipados con retiro por horario.", "prompt": "¿Qué caracteriza el origen de su idea?", "options": ["Depende exclusivamente de una inspiración sin contexto.", "La existencia de soluciones previas elimina toda oportunidad.", "Integra observación de problemas, experiencia del cliente y adaptación de soluciones.", "Usar tecnología garantiza diferenciación permanente."], "answer": "2", "explanation": "Las ideas pueden surgir de problemas, experiencias, tendencias y adaptación de prácticas de otros sectores."}, {"id": 15, "area": 0, "topic": "Técnicas creativas", "type": "select", "context": "Un grupo adapta una mochila: sustituye materiales, combina compartimentos y elimina piezas que no aportan valor.", "prompt": "¿Qué técnica describe mejor ese trabajo?", "options": ["SCAMPER, al transformar sistemáticamente una propuesta existente.", "Punto de equilibrio, al calcular costos e ingresos.", "Muestreo aleatorio, al seleccionar participantes.", "Organigrama, al distribuir autoridad."], "answer": "0", "explanation": "SCAMPER genera alternativas mediante operaciones como sustituir, combinar, adaptar, modificar y eliminar."}, {"id": 16, "area": 0, "topic": "Selección de ideas", "type": "select", "context": "Tres ideas se valoran con pesos: necesidad del cliente 50 %, factibilidad 30 % y sostenibilidad 20 %. Se usan datos de entrevistas y pruebas.", "prompt": "¿Qué ventaja ofrece esta matriz?", "options": ["Elimina la necesidad de justificar las puntuaciones.", "Garantiza que la idea con mejor puntaje tendrá éxito.", "Permite ignorar el criterio de los usuarios.", "Hace explícitos los criterios y compara alternativas con una base común."], "answer": "3", "explanation": "La matriz ayuda a argumentar una selección; depende de evidencia, pesos y puntuaciones, y no garantiza éxito."}, {"id": 17, "area": 0, "topic": "Creatividad e innovación", "type": "select", "context": "Un equipo imagina cinco formas de reducir filas. Prueba una, la implementa y demuestra una reducción del tiempo de espera.", "prompt": "¿Cuál afirmación distingue mejor ambos conceptos?", "options": ["Solo es creatividad si todas las ideas se comercializan.", "Generar alternativas muestra creatividad; implementar una mejora útil muestra innovación.", "Cualquier ocurrencia es ya una innovación implementada.", "La innovación requiere necesariamente una patente."], "answer": "1", "explanation": "La creatividad genera ideas; la innovación supone introducir una solución o mejora que aporte valor en su contexto."}, {"id": 18, "area": 0, "topic": "Tipos de innovación", "type": "select", "context": "Una empresa conserva su producto, pero reorganiza pedidos y rutas para reducir entregas fallidas.", "prompt": "¿Qué tipo de innovación predomina?", "options": ["Innovación de producto, porque cambia la función del bien.", "Innovación financiera, porque obtiene un préstamo.", "Innovación de proceso, porque mejora cómo realiza la operación.", "Innovación de empaque, porque modifica la presentación."], "answer": "2", "explanation": "El cambio central está en el método de operación y entrega, por lo que predomina la innovación de proceso."}, {"id": 19, "area": 0, "topic": "Desarrollo sostenible", "type": "select", "context": "Un negocio reduce plástico, pero paga salarios insuficientes y opera con pérdidas permanentes.", "prompt": "¿Qué valoración es la más completa?", "options": ["La mejora ambiental es valiosa, pero debe atender también las dimensiones social y económica.", "Es sostenible porque una dimensión compensa siempre las demás.", "La sostenibilidad depende únicamente del material del empaque.", "Las condiciones laborales no forman parte del desarrollo sostenible."], "answer": "0", "explanation": "La sostenibilidad integra viabilidad económica, bienestar social y cuidado ambiental; no se acredita con una sola acción."}, {"id": 20, "area": 0, "topic": "Impacto ambiental", "type": "select", "context": "Una cafetería desea disminuir residuos. Puede comprar más basureros o rediseñar compras y porciones para evitar desperdicio.", "prompt": "¿Qué decisión actúa primero sobre la causa?", "options": ["Cambiar el color de los basureros sin medir residuos.", "Desechar más rápido para liberar espacio.", "Promover envases ecológicos sin revisar consumo.", "Medir lo descartado y ajustar compras y producción para prevenir residuos."], "answer": "3", "explanation": "Prevenir la generación de residuos actúa antes del descarte; medir permite identificar dónde reducirlos."}, {"id": 21, "area": 0, "topic": "Financiamiento inicial", "type": "select", "context": "Un emprendimiento aún no valida ventas. Le ofrecen una deuda con cuotas altas para comprar equipo que usaría solo a media capacidad.", "prompt": "¿Qué análisis debería priorizar?", "options": ["Aceptar porque todo equipo aumenta las utilidades.", "Contrastar cuotas, flujo esperado y alternativas de inversión gradual antes de endeudarse.", "Decidir solo por el monto total ofrecido.", "Ignorar el riesgo si el equipo es moderno."], "answer": "1", "explanation": "La financiación debe corresponder a necesidades y capacidad de pago; una inversión gradual puede reducir exposición antes de validar demanda."}, {"id": 22, "area": 0, "topic": "Riesgo emprendedor", "type": "tf", "context": "Dos equipos pueden obtener la misma rentabilidad estimada, pero uno depende de un único proveedor.", "prompt": "Evaluar solo la ganancia prevista basta para afirmar que ambos tienen el mismo riesgo.", "options": ["Verdadero", "Falso"], "answer": "1", "explanation": "La concentración de proveedores puede afectar continuidad, precios y capacidad de respuesta; igual ganancia estimada no implica igual riesgo."}, {"id": 23, "area": 0, "topic": "Investigación de mercado", "type": "tf", "context": "Un equipo entrevista usuarios, observa su rutina y compara los hallazgos.", "prompt": "Combinar distintas fuentes puede fortalecer la comprensión de una necesidad cuando se analizan sus coincidencias y diferencias.", "options": ["Verdadero", "Falso"], "answer": "0", "explanation": "La triangulación ayuda a contrastar evidencia y detectar contradicciones; no elimina automáticamente todos los sesgos."}, {"id": 24, "area": 0, "topic": "Tendencias", "type": "tf", "context": "Una tendencia de redes sociales recibe miles de visualizaciones.", "prompt": "Su popularidad garantiza demanda suficiente y rentable en la comunidad del colegio.", "options": ["Verdadero", "Falso"], "answer": "1", "explanation": "La visibilidad no confirma demanda local, disposición de pago, costos ni permanencia de la tendencia."}, {"id": 25, "area": 0, "topic": "Cultura emprendedora", "type": "tf", "context": "Después de una prueba fallida, el equipo registra lo aprendido y ajusta su hipótesis.", "prompt": "Esta conducta puede reflejar una cultura emprendedora basada en aprendizaje y mejora.", "options": ["Verdadero", "Falso"], "answer": "0", "explanation": "Aprender de evidencia, asumir responsabilidad y ajustar acciones favorece la cultura emprendedora."}, {"id": 26, "area": 0, "topic": "Innovación", "type": "tf", "context": "Un taller compra una máquina nueva, pero nunca la integra a sus procesos.", "prompt": "La compra por sí sola demuestra una innovación que ya aporta valor al negocio.", "options": ["Verdadero", "Falso"], "answer": "1", "explanation": "La adquisición no equivale a implementación; hay que introducir el cambio y evaluar el valor que aporta."}, {"id": 27, "area": 0, "topic": "Impacto social", "type": "tf", "context": "Una empresa facilita empleo digno y acceso a servicios, además de reducir residuos.", "prompt": "Para evaluar sostenibilidad deben considerarse esos efectos sociales junto con los económicos y ambientales.", "options": ["Verdadero", "Falso"], "answer": "0", "explanation": "Las tres dimensiones permiten valorar el proyecto de forma integrada."}, {"id": 28, "area": 0, "topic": "Tecnología y ética", "type": "tf", "context": "Un equipo quiere recopilar nombres y teléfonos para validar una idea.", "prompt": "Que los datos sean útiles para el negocio permite recoger cualquier dato personal sin explicar su finalidad.", "options": ["Verdadero", "Falso"], "answer": "1", "explanation": "La utilidad no elimina la responsabilidad de informar, limitar la recolección y proteger la información."}, {"id": 29, "area": 0, "topic": "Interpretación de datos", "type": "fill", "context": "En una consulta a 80 personas, 52 señalan el horario como principal barrera para comprar.", "prompt": "¿Qué porcentaje representa? Escriba solo el número, sin el signo %.", "answer": "65", "accepted": ["65"], "explanation": "52 ÷ 80 × 100 = 65 %. Este resultado describe la consulta realizada, no necesariamente todo el mercado."}, {"id": 30, "area": 0, "topic": "Evidencia de demanda", "type": "fill", "context": "De 150 personas que visitan una demostración, 30 realizan una reserva.", "prompt": "Calcule la tasa de reserva en porcentaje. Escriba solo el número.", "answer": "20", "accepted": ["20"], "explanation": "30 ÷ 150 × 100 = 20 %. La conversión se calcula sobre quienes estuvieron expuestos a la oferta."}, {"id": 31, "area": 0, "topic": "Matriz de selección", "type": "fill", "context": "Una idea obtiene 4 en necesidad (peso 50 %), 3 en factibilidad (30 %) y 5 en sostenibilidad (20 %).", "prompt": "Calcule el puntaje ponderado en escala de 1 a 5. Use coma o punto decimal.", "answer": "3.9", "accepted": ["3.9", "3,9"], "explanation": "4 × 0,50 + 3 × 0,30 + 5 × 0,20 = 3,9 puntos."}, {"id": 32, "area": 0, "topic": "Prevención de residuos", "type": "fill", "context": "Una cafetería reduce sus residuos semanales de 40 kg a 28 kg.", "prompt": "¿En qué porcentaje disminuyeron respecto del valor inicial? Escriba solo el número.", "answer": "30", "accepted": ["30"], "explanation": "La reducción fue de 12 kg; 12 ÷ 40 × 100 = 30 %."}, {"id": 33, "area": 0, "topic": "Investigación del cliente", "type": "fill", "context": "Se necesita comprender en profundidad por qué los clientes abandonan una compra. Se utilizará una conversación individual con preguntas abiertas y repreguntas.", "prompt": "Complete con el nombre de esta técnica: ________ en profundidad.", "answer": "entrevista", "accepted": ["entrevista", "entrevistas"], "explanation": "La entrevista en profundidad explora motivos y experiencias mediante diálogo; no se limita a contar respuestas."}, {"id": 34, "area": 0, "topic": "Selección de ideas", "type": "fill", "context": "Un equipo compara ideas usando criterios, pesos y puntuaciones, para explicar por qué elige una.", "prompt": "Complete: matriz de decisión ________.", "answer": "ponderada", "accepted": ["ponderada", "de ponderacion", "de ponderación"], "explanation": "La ponderación expresa la importancia relativa de cada criterio en la comparación de alternativas."}, {"id": 35, "area": 0, "topic": "Innovación de procesos", "type": "fill", "context": "Un negocio reduce errores de despacho al cambiar el método de preparación, sin cambiar el producto.", "prompt": "Complete: predomina una innovación de ________.", "answer": "proceso", "accepted": ["proceso", "procesos"], "explanation": "El cambio mejora el método de trabajo o entrega, por eso se clasifica como innovación de proceso."}, {"id": 36, "area": 1, "topic": "Propuesta de valor", "type": "select", "context": "Dos servicios reparan computadoras. Uno ofrece diagnóstico explicado en lenguaje claro, recogida y seguimiento para personas sin conocimientos técnicos.", "prompt": "¿Dónde se encuentra su diferenciación principal?", "options": ["En afirmar que el servicio es el mejor sin evidencias.", "En atender simultáneamente a todo el mercado.", "En beneficios concretos que resuelven dificultades de un segmento definido.", "En usar el mismo precio que sus competidores."], "answer": "2", "explanation": "La propuesta de valor vincula problemas y beneficios relevantes para un segmento, no solo características o afirmaciones promocionales."}, {"id": 37, "area": 1, "topic": "Segmentos y canales", "type": "select", "context": "Un negocio vende ayudas para personas mayores. Quienes usan el producto rara vez compran por Internet, mientras sus familiares sí investigan en línea.", "prompt": "¿Qué decisión reconoce mejor la diferencia entre usuario y comprador?", "options": ["Investigar a ambos y combinar canales accesibles para uso y compra.", "Eliminar la atención presencial por tener una página web.", "Suponer que usuario y comprador siempre son la misma persona.", "Dirigir toda la comunicación a quienes nunca participan en la decisión."], "answer": "0", "explanation": "Usuario, comprador y decisor pueden ser diferentes; el modelo debe comprender sus necesidades y canales."}, {"id": 38, "area": 1, "topic": "Relación con clientes", "type": "select", "context": "Una plataforma de tutorías promete acompañamiento personalizado, pero solo responde con mensajes automáticos que no resuelven dudas.", "prompt": "¿Qué inconsistencia del modelo debe corregirse?", "options": ["La estructura de costos no incluye empaques.", "El segmento siempre requiere atención presencial.", "Los aliados deben sustituir al estudiante.", "La relación ofrecida no corresponde con el acompañamiento que recibe el cliente."], "answer": "3", "explanation": "La propuesta de valor, los canales y la relación con clientes deben ser coherentes entre sí."}, {"id": 39, "area": 1, "topic": "Actividades y recursos clave", "type": "select", "context": "Una microempresa ofrece calibración de sensores. Necesita equipo de medición y personal capacitado para ejecutar las calibraciones.", "prompt": "¿Cuál clasificación es correcta?", "options": ["Equipo: actividad; calibrar: recurso; personal: canal.", "Calibrar: actividad clave; equipo y conocimientos: recursos clave.", "Equipo y calibrar: segmentos de clientes.", "Personal: ingreso; calibrar: estructura de costos."], "answer": "1", "explanation": "Las actividades son lo que se hace; los recursos son medios físicos, humanos, intelectuales o financieros para hacerlo."}, {"id": 40, "area": 1, "topic": "Aliados clave", "type": "select", "context": "Una empresa de meriendas acuerda entregas periódicas con productores locales para asegurar ingredientes y calidad.", "prompt": "¿Por qué esos productores pueden considerarse aliados clave?", "options": ["Porque automáticamente pasan a ser empleados del negocio.", "Porque sustituyen la necesidad de administrar costos.", "Porque aportan recursos críticos y continuidad a la propuesta de valor.", "Porque toda compra ocasional constituye una alianza estratégica."], "answer": "2", "explanation": "Una alianza clave apoya capacidades o recursos esenciales; va más allá de una transacción sin relación estratégica."}, {"id": 41, "area": 1, "topic": "Modelo de ingresos", "type": "select", "context": "Una aplicación cobra una cuota mensual por acceso al servicio y otra empresa cobra por cada reparación realizada.", "prompt": "¿Qué diferencia describe sus modelos de ingresos?", "options": ["Suscripción recurrente frente a cobro por transacción o servicio.", "Ambas tienen necesariamente la misma estructura de ingresos.", "La primera no necesita clientes y la segunda sí.", "El modelo de ingresos describe únicamente cómo se financia el equipo inicial."], "answer": "0", "explanation": "El modelo de ingresos explica cómo se cobra valor al cliente; no debe confundirse con las fuentes de financiación."}, {"id": 42, "area": 1, "topic": "Business Model Canvas", "type": "select", "context": "Un equipo cambia de venta presencial a suscripción con entrega a domicilio. Mantiene los demás bloques del Canvas sin revisarlos.", "prompt": "¿Qué debería hacer?", "options": ["Cambiar solo el logotipo para anunciar la suscripción.", "Evitar revisar costos porque ya tiene un precio.", "Considerar el Canvas terminado desde la primera versión.", "Revisar canales, relaciones, actividades, costos e ingresos afectados por el cambio."], "answer": "3", "explanation": "Los bloques del modelo son interdependientes; cambiar la forma de entregar y cobrar puede modificar toda la operación."}, {"id": 43, "area": 1, "topic": "Herramientas y metodologías", "type": "select", "context": "Un equipo necesita comprender un problema humano ambiguo y después representar cómo entregará valor y obtendrá ingresos.", "prompt": "¿Qué combinación de herramientas responde mejor a ambas necesidades?", "options": ["Punto de equilibrio para empatizar y organigrama para validar.", "Design Thinking para explorar el problema y Canvas para representar el modelo.", "Un catálogo sustituye tanto la investigación como el modelo.", "Un logotipo define por sí mismo el problema y la rentabilidad."], "answer": "1", "explanation": "Design Thinking ayuda a explorar necesidades y soluciones; el Canvas representa la lógica del negocio. Son complementarios."}, {"id": 44, "area": 1, "topic": "Design Thinking: empatizar", "type": "select", "context": "Un grupo quiere mejorar el transporte de estudiantes y empieza eligiendo una aplicación sin conversar con usuarios.", "prompt": "¿Qué acción debe incorporar para reducir ese supuesto inicial?", "options": ["Diseñar más pantallas antes de observar el problema.", "Seleccionar colores por votación del equipo.", "Escuchar y observar trayectos, dificultades y necesidades de los usuarios.", "Comprar publicidad para probar si el nombre gusta."], "answer": "2", "explanation": "Empatizar implica comprender experiencias reales antes de comprometerse con una solución predeterminada."}, {"id": 45, "area": 1, "topic": "Design Thinking: definir", "type": "select", "context": "Las entrevistas muestran que estudiantes pierden conexiones por información de horarios dispersa.", "prompt": "¿Cuál definición del problema orienta mejor la ideación?", "options": ["Estudiantes con conexiones entre rutas necesitan información confiable y oportuna para planificar sus traslados.", "Necesitamos una aplicación porque todas las empresas tienen una.", "Debemos crear el producto más famoso del colegio.", "Hay que vender publicidad antes de saber quién usará el servicio."], "answer": "0", "explanation": "Una definición útil identifica usuarios, necesidad y contexto, sin cerrar prematuramente la solución."}, {"id": 46, "area": 1, "topic": "Prototipado", "type": "select", "context": "Un equipo dibuja en papel el recorrido de una aplicación y pide a usuarios que intenten completar una reserva.", "prompt": "¿Qué busca principalmente con ese prototipo?", "options": ["Demostrar rentabilidad anual con exactitud.", "Sustituir todas las futuras pruebas del producto.", "Probar que el software ya funciona en producción.", "Aprender sobre comprensión y uso antes de invertir en desarrollo."], "answer": "3", "explanation": "Un prototipo de baja fidelidad permite observar interacción y detectar problemas con bajo costo; no demuestra funcionalidad técnica final."}, {"id": 47, "area": 1, "topic": "Producto mínimo viable", "type": "select", "context": "Para validar si talleres pagarían por alertas de inventario, un equipo ofrece una prueba manual del servicio a cinco talleres.", "prompt": "¿Qué condición haría que esta prueba funcione como PMV?", "options": ["Que incluya todas las funciones de la versión final.", "Que entregue el valor central y permita medir una hipótesis con usuarios reales.", "Que se construya necesariamente como una aplicación móvil.", "Que evite recibir comentarios para no cambiar la idea."], "answer": "1", "explanation": "Un PMV es la versión mínima que permite aprender sobre hipótesis relevantes al entregar valor a usuarios."}, {"id": 48, "area": 1, "topic": "Lean Startup", "type": "select", "context": "Una hipótesis afirma que al menos 8 de 20 talleres pagarán por una alerta mensual. El equipo aún no ha hecho la prueba.", "prompt": "¿Qué secuencia responde al ciclo de aprendizaje?", "options": ["Construir todo el sistema, ampliar personal y luego escuchar clientes.", "Medir seguidores, elegir un logo y pedir financiación.", "Construir una prueba mínima, medir pagos y aprender para decidir.", "Evitar criterios de éxito para aceptar cualquier resultado."], "answer": "2", "explanation": "Construir, medir y aprender conecta una prueba con evidencia y decisiones sobre la hipótesis."}, {"id": 49, "area": 1, "topic": "Validación y métricas", "type": "select", "context": "Un PMV recibe 2 000 visitas; 100 personas inician registro, 20 terminan y 3 pagan.", "prompt": "¿Qué evidencia se relaciona más directamente con disposición de pago?", "options": ["Los 3 pagos efectivos, considerando precio, contexto y muestra.", "Las 2 000 visitas sin distinguir su comportamiento.", "El número de colores de la interfaz.", "La cantidad de publicaciones que hace el equipo."], "answer": "0", "explanation": "Los pagos son una señal conductual más directa que la exposición o el interés; su alcance debe interpretarse con cautela."}, {"id": 50, "area": 1, "topic": "Pivotar o perseverar", "type": "select", "context": "La prueba muestra que restaurantes pagan por control de desperdicio, pero no por la función inicial de recetas.", "prompt": "¿Qué decisión usa mejor la evidencia?", "options": ["Mantener todo igual para respetar el primer plan.", "Eliminar la investigación porque contradice la idea inicial.", "Afirmar que ambas funciones están igualmente validadas.", "Reformular la propuesta alrededor del problema validado y volver a probar."], "answer": "3", "explanation": "Pivotar es un cambio fundamentado en aprendizaje; exige comprobar la nueva propuesta, no asumir éxito definitivo."}, {"id": 51, "area": 1, "topic": "Plan de implementación", "type": "select", "context": "Una empresa quiere lanzar pedidos en línea en un mes. Tiene diseño de marca, pero no responsables, presupuesto ni calendario.", "prompt": "¿Qué debe agregar para volver ejecutable el plan?", "options": ["Más propuestas de nombre comercial.", "Actividades, responsables, recursos, plazos e indicadores de seguimiento.", "Solo una estimación de ventas optimista.", "Un catálogo sin capacidad de producción definida."], "answer": "1", "explanation": "La implementación convierte decisiones en acciones coordinadas con recursos, fechas y criterios de seguimiento."}, {"id": 52, "area": 1, "topic": "Finanzas de implementación", "type": "select", "context": "Una empresa tiene equipo y ventas previstas, pero los clientes pagarán a 30 días y los proveedores exigen pago inmediato.", "prompt": "¿Qué necesidad debe analizar?", "options": ["Solo el costo del logotipo.", "Únicamente la cantidad de seguidores.", "Capital de trabajo para cubrir el desfase entre pagos y cobros.", "Reemplazar el flujo de caja por la utilidad contable."], "answer": "2", "explanation": "El capital de trabajo sostiene la operación mientras se convierten ventas en cobros. Ganancias previstas no garantizan efectivo disponible."}, {"id": 53, "area": 1, "topic": "Negociación", "type": "select", "context": "Un proveedor no puede bajar el precio, pero ofrece entregas más pequeñas sin recargo. Esto reduciría pérdidas e inventario.", "prompt": "¿Qué estrategia resulta más adecuada?", "options": ["Explorar intereses y valorar el acuerdo por su costo y beneficio total.", "Rechazarlo sin calcular efectos porque no hubo descuento.", "Aceptar cualquier condición para evitar negociar.", "Amenazar con información falsa para obtener el precio deseado."], "answer": "0", "explanation": "Negociar por intereses permite crear valor con plazos, cantidades o calidad, además del precio."}, {"id": 54, "area": 1, "topic": "Alternativas de negociación", "type": "select", "context": "Un proveedor exige un mínimo que el emprendimiento no puede pagar. El equipo dispone de otra oferta viable.", "prompt": "¿Cómo debe utilizar esa alternativa?", "options": ["Ocultarla al equipo y firmar de inmediato.", "Aceptar un compromiso inviable para conservar la relación.", "Inventar cotizaciones para presionar.", "Comparar el acuerdo con su mejor alternativa y negociar dentro de límites viables."], "answer": "3", "explanation": "Una alternativa real fortalece el análisis y evita aceptar acuerdos peores o imposibles de cumplir."}, {"id": 55, "area": 1, "topic": "Ética y compromiso social", "type": "select", "context": "Para aumentar el margen, un equipo propone no pagar horas trabajadas y usar imágenes ajenas sin autorización.", "prompt": "¿Qué decisión es coherente con una propuesta responsable?", "options": ["Aceptar mientras el negocio sea pequeño.", "Revisar costos y precios preservando condiciones justas y respeto por el trabajo ajeno.", "Compensar ambas prácticas con una campaña ecológica.", "Publicitar valores éticos sin modificar la operación."], "answer": "1", "explanation": "El compromiso ético debe reflejarse en decisiones operativas y económicas; no se sustituye por publicidad o acciones aisladas."}, {"id": 56, "area": 1, "topic": "Economía social solidaria", "type": "select", "context": "Personas productoras quieren gestionar juntas compras y comercialización, participar en decisiones y atender necesidades comunes.", "prompt": "¿Qué rasgo deben priorizar al valorar un modelo cooperativo?", "options": ["Concentrar decisiones según el dinero aportado por un solo inversionista.", "Repartir beneficios sin considerar reglas ni participación.", "Gestión democrática y finalidad de beneficio común, con viabilidad económica.", "Eliminar cualquier planificación porque no busca solo beneficio individual."], "answer": "2", "explanation": "La cooperación articula participación, ayuda mutua y necesidades comunes; también requiere una gestión económicamente viable."}, {"id": 57, "area": 1, "topic": "Coherencia del modelo", "type": "tf", "context": "La empresa cambia su segmento de estudiantes a empresas con requisitos de soporte.", "prompt": "Puede ser necesario revisar propuesta de valor, canales, relación y costos por ese cambio.", "options": ["Verdadero", "Falso"], "answer": "0", "explanation": "Un segmento diferente puede exigir beneficios, atención y procesos distintos; los bloques deben revisarse conjuntamente."}, {"id": 58, "area": 1, "topic": "PMV", "type": "tf", "context": "El equipo decide incluir veinte funciones antes de hacer la primera prueba con clientes.", "prompt": "Cuantas más funciones incluya, más válido será necesariamente su PMV.", "options": ["Verdadero", "Falso"], "answer": "1", "explanation": "El PMV se diseña para probar hipótesis con el mínimo necesario; agregar funciones puede encarecer y retrasar el aprendizaje."}, {"id": 59, "area": 1, "topic": "Validación", "type": "tf", "context": "Diez personas dicen que una idea es interesante, sin usarla ni pagar por ella.", "prompt": "Estas opiniones bastan para afirmar que se validó un negocio rentable.", "options": ["Verdadero", "Falso"], "answer": "1", "explanation": "Una opinión favorable no confirma adopción, pago, estructura de costos ni viabilidad del negocio."}, {"id": 60, "area": 1, "topic": "Design Thinking", "type": "tf", "context": "Una prueba con usuarios revela una necesidad que el equipo no había observado.", "prompt": "El equipo puede regresar a definir el problema y generar nuevas soluciones.", "options": ["Verdadero", "Falso"], "answer": "0", "explanation": "El proceso es iterativo; aprender en una fase puede llevar a revisar fases anteriores."}, {"id": 61, "area": 1, "topic": "Negociación ética", "type": "tf", "context": "Un acuerdo beneficia a las dos partes y sus obligaciones quedan claras.", "prompt": "Escuchar intereses y verificar que ambas partes puedan cumplir favorece la sostenibilidad del acuerdo.", "options": ["Verdadero", "Falso"], "answer": "0", "explanation": "La claridad, la escucha y la viabilidad fortalecen la confianza y reducen conflictos posteriores."}, {"id": 62, "area": 1, "topic": "Asociaciones solidaristas", "type": "tf", "context": "Un grupo confunde cooperativa y asociación solidarista por tratarse de formas asociativas.", "prompt": "Tener fines de cooperación significa que sus modelos, participantes y reglas son idénticos.", "options": ["Verdadero", "Falso"], "answer": "1", "explanation": "Las formas asociativas tienen características y marcos propios. Deben analizarse sus objetivos y requisitos sin tratarlas como equivalentes."}, {"id": 63, "area": 1, "topic": "Salud integral y lanzamiento", "type": "tf", "context": "Un servicio de entregas promete tiempos que obligarían al personal a conducir de forma insegura.", "prompt": "El plan de lanzamiento debe revisar esa promesa y sus efectos sobre la salud y seguridad.", "options": ["Verdadero", "Falso"], "answer": "0", "explanation": "Mitigar impactos exige alinear promesas, capacidad y condiciones de trabajo seguras."}, {"id": 64, "area": 1, "topic": "Tasa de pago", "type": "fill", "context": "En la prueba de un PMV, 12 de 60 usuarios pagan por continuar.", "prompt": "Calcule el porcentaje de conversión a pago. Escriba solo el número.", "answer": "20", "accepted": ["20"], "explanation": "12 ÷ 60 × 100 = 20 %."}, {"id": 65, "area": 1, "topic": "Criterio de validación", "type": "fill", "context": "Antes de probar, se fija como umbral que al menos el 25 % de 40 usuarios reserve el servicio.", "prompt": "¿Cuál es el mínimo de reservas para alcanzar el umbral? Escriba solo el número.", "answer": "10", "accepted": ["10"], "explanation": "40 × 0,25 = 10 reservas. El criterio debe fijarse antes de interpretar los resultados."}, {"id": 66, "area": 1, "topic": "Ingresos del modelo", "type": "fill", "context": "Un servicio tiene 35 suscripciones activas de ₡4 000 mensuales. No hay descuentos ni otros ingresos.", "prompt": "Calcule el ingreso mensual en colones. Escriba solo dígitos, sin separadores.", "answer": "140000", "accepted": ["140000"], "explanation": "35 × 4 000 = ₡140 000 de ingreso mensual; no equivale a utilidad."}, {"id": 67, "area": 1, "topic": "Margen de contribución", "type": "fill", "context": "El precio unitario es ₡5 000 y el costo variable unitario es ₡3 200.", "prompt": "Calcule el margen de contribución por unidad en colones. Escriba solo dígitos.", "answer": "1800", "accepted": ["1800"], "explanation": "5 000 − 3 200 = ₡1 800 disponibles por unidad para cubrir costos fijos y luego generar utilidad."}, {"id": 68, "area": 1, "topic": "Punto de equilibrio", "type": "fill", "context": "Los costos fijos son ₡90 000 por mes; cada venta aporta ₡1 800 de margen de contribución.", "prompt": "¿Cuántas unidades deben venderse para alcanzar el punto de equilibrio? Escriba solo el número.", "answer": "50", "accepted": ["50"], "explanation": "90 000 ÷ 1 800 = 50 unidades, suponiendo precios y costos constantes en el rango analizado."}, {"id": 69, "area": 1, "topic": "Aprendizaje validado", "type": "fill", "context": "Después de medir el PMV, un nente."], "answer": "3", "explanation": "La forma jurídica debe responder a la organización real del negocio, sus riesgos y requisitos; no se decide solo por popularidad."}, {"id": 73, "area": 2, "topic": "Plan de negocios", "type": "select", "context": "Un proyecto incluye objetivos y publicidad, pero no analiza capacidad productiva, inversión ni flujo de efectivo.", "prompt": "¿Qué debe integrar para valorar mejor su viabilidad?", "options": ["Estudios técnico, económico y financiero articulados con el mercado.", "Solo una portada más formal.", "Un catálogo más extenso sin costos.", "Más ventas proyectadas sin justificar supuestos."], "answer": "0", "explanation": "El plan articula mercado, operación e implicaciones económicas y financieras para evaluar la propuesta de forma integral."}, {"id": 74, "area": 2, "topic": "Estudios del negocio", "type": "select", "context": "Un equipo estima cuántos pedidos puede producir por hora, qué equipo requiere y cómo distribuirá el espacio.", "prompt": "¿A qué estudio corresponde principalmente este análisis?", "options": ["Estudio de mercado, centrado en preferencias y demanda.", "Estudio de mercadeo, centrado en promoción.", "Estudio técnico, centrado en cómo y con qué se produce.", "Estudio jurídico, centrado en la forma de constitución."], "answer": "2", "explanation": "Capacidad, equipos, localización y distribución física son componentes del estudio técnico."}, {"id": 75, "area": 2, "topic": "Objetivos SMART", "type": "select", "context": "Un equipo busca mejorar la entrega. Actualmente completa a tiempo 70 de cada 100 pedidos.", "prompt": "¿Cuál objetivo permite evaluar mejor el cambio?", "options": ["Ser la empresa más eficiente de todo el país.", "Elevar las entregas a tiempo del 70 % al 90 % en ocho semanas, con registro semanal.", "Mejorar bastante la entrega cuando sea posible.", "Comprar una impresora sin relacionarla con resultados."], "answer": "1", "explanation": "El objetivo indica variable, línea base, meta y plazo; es específico y medible. Su alcanzabilidad debe contrastarse con recursos y acciones."}, {"id": 76, "area": 2, "topic": "Formalización", "type": "select", "context": "Un emprendimiento alimentario prepara su apertura. El equipo cree que tener nombre y logo equivale a estar formalizado.", "prompt": "¿Cuál es el siguiente enfoque más adecuado?", "options": ["Abrir y revisar obligaciones únicamente si recibe una queja.", "Usar los permisos de otro negocio sin comprobar su validez.", "Suponer que un mismo trámite cubre toda actividad y ubicación.", "Verificar con las instituciones competentes los trámites tributarios, municipales, sanitarios y laborales aplicables."], "answer": "3", "explanation": "La formalización depende de actividad, ubicación y organización. Debe verificarse con fuentes oficiales y no se sustituye con identidad comercial."}, {"id": 77, "area": 2, "topic": "Contratación y protección social", "type": "select", "context": "La empresa planea incorporar una persona de forma continua, bajo horario y supervisión. El presupuesto solo incluye el dinero que recibirá mensualmente.", "prompt": "¿Qué aspecto debe revisar antes de contratar?", "options": ["La naturaleza real de la relación y el costo integral de sus obligaciones laborales y de protección social.", "Solo el nombre del puesto para evitar obligaciones.", "La posibilidad de registrar el pago como publicidad.", "La suposición de que un acuerdo verbal elimina toda responsabilidad."], "answer": "0", "explanation": "La planificación debe considerar la relación real y sus obligaciones, no solo la remuneración entregada. No se usan tasas legales en esta simulación."}, {"id": 78, "area": 2, "topic": "Cadena de valor", "type": "select", "context": "Una empresa detecta errores entre ventas y producción: se prometen personalizaciones que el taller no puede fabricar.", "prompt": "¿Qué mejora aplica un enfoque orientado al cliente?", "options": ["Pedir al cliente que coordine directamente los departamentos.", "Medir únicamente cuánto vende cada persona.", "Definir cómo se verifican requisitos y capacidad antes de confirmar el pedido.", "Eliminar toda comunicación entre áreas para ahorrar tiempo."], "answer": "2", "explanation": "La cadena de valor coordina actividades para cumplir lo prometido al cliente, evitando fallos entre departamentos."}, {"id": 79, "area": 2, "topic": "Procesos y procedimientos", "type": "select", "context": "El negocio documenta «gestionar devoluciones» y luego redacta los pasos para recibir, verificar y resolver cada solicitud.", "prompt": "¿Cuál distinción es correcta?", "options": ["Ambos conceptos se refieren exclusivamente al organigrama.", "El proceso transforma entradas en resultados; el procedimiento especifica cómo se ejecutan actividades.", "El procedimiento fija la misión y el proceso solo los salarios.", "Un proceso solo puede existir si está automatizado."], "answer": "1", "explanation": "El proceso organiza actividades hacia un resultado; el procedimiento describe instrucciones y responsabilidades para realizarlas."}, {"id": 80, "area": 2, "topic": "Asociatividad y encadenamientos", "type": "select", "context": "Una empresa turística compra alimentos a productores locales que, a su vez, coordinan producción para cumplir pedidos.", "prompt": "¿Qué relación se observa principalmente entre turismo y sus proveedores?", "options": ["Una fusión que elimina la independencia de todos.", "Una competencia sin intercambio económico.", "Una relación laboral automática entre negocios.", "Un encadenamiento productivo entre actividades que se abastecen y complementan."], "answer": "3", "explanation": "El encadenamiento conecta etapas y empresas que aportan bienes o servicios a una oferta final; no implica fusión."}, {"id": 81, "area": 2, "topic": "Clúster", "type": "select", "context": "En una región conviven empresas de un sector, proveedores, un centro de formación y entidades de apoyo que colaboran y compiten.", "prompt": "¿Qué concepto describe mejor esta concentración territorial?", "options": ["Clúster, por la proximidad y las relaciones entre actores vinculados.", "Organigrama de una única empresa.", "Procedimiento de facturación.", "Alianza ocasional entre dos compradores sin vínculo territorial."], "answer": "0", "explanation": "Un clúster reúne actores relacionados en un territorio, con interacciones productivas, conocimiento y apoyo."}, {"id": 82, "area": 2, "topic": "Principios de administración", "type": "select", "context": "Durante un evento, Gerencia define metas, asigna funciones, coordina la ejecución y compara resultados con lo previsto.", "prompt": "¿Qué secuencia administrativa está aplicando?", "options": ["Vender, cobrar, archivar y publicar.", "Financiar, endeudarse, competir y cerrar.", "Planear, organizar, dirigir y controlar.", "Producir, empacar, transportar y devolver."], "answer": "2", "explanation": "La secuencia integra definición de objetivos, distribución de recursos, conducción del trabajo y evaluación de resultados."}, {"id": 83, "area": 2, "topic": "Áreas funcionales", "type": "select", "context": "Mercadeo promete 200 pedidos; Producción solo puede atender 120. Finanzas aún no aprueba la compra de insumos.", "prompt": "¿Qué acción del Centro de Operaciones resuelve mejor la situación?", "options": ["Confirmar los 200 pedidos y esperar que el equipo se adapte.", "Coordinar capacidad, presupuesto y promesa comercial antes de aceptar compromisos.", "Pedir a cada departamento que cumpla su meta por separado.", "Ocultar la limitación de producción a Gerencia."], "answer": "1", "explanation": "El Centro de Operaciones facilita coordinación entre áreas para asumir compromisos viables y mantener información coherente."}, {"id": 84, "area": 2, "topic": "Transacciones comerciales", "type": "select", "context": "Compras recibe mercadería y una factura, pero aún no verifica cantidades ni condiciones pactadas.", "prompt": "¿Qué control corresponde antes de autorizar el pago?", vicio fue satisfactorio.", "Hubo una atención cordial, pero el proceso de servicio no resolvió la necesidad.", "Atención y servicio son siempre idénticos.", "Resolver reclamos es responsabilidad exclusiva del cliente."], "answer": "1", "explanation": "La atención incluye el trato; el servicio comprende la experiencia y los procesos que cumplen la necesidad."}, {"id": 88, "area": 2, "topic": "Tecnología, búsqueda y colaboración", "type": "select", "context": "Un equipo debe verificar requisitos para operar y elaborar una guía colaborativa. Encuentra un blog antiguo y un portal institucional actualizado.", "prompt": "¿Qué estrategia combina mejor calidad de información y colaboración?", "options": ["Copiar el primer resultado y omitir fecha y autor.", "Sustituir la fuente oficial por una publicación con más likes.", "Publicar datos personales del equipo para dar credibilidad.", "Contrastar fuentes oficiales y fechas, registrar referencias y editar la guía con control de versiones."], "answer": "3", "explanation": "La calidad depende de autoridad, vigencia y contraste; el control de versiones y las referencias apoyan una colaboración responsable."}, {"id": 89, "area": 2, "topic": "Rentabilidad y liquidez", "type": "tf", "context": "Una empresa vende a crédito y debe pagar insumos esta semana.", "prompt": "Puede mostrar utilidad y, al mismo tiempo, carecer del efectivo necesario para pagar.", "options": ["Verdadero", "Falso"], "answer": "0", "explanation": "La utilidad y el flujo de caja difieren: el momento del cobro puede ser posterior al reconocimiento de la venta."}, {"id": 90, "area": 2, "topic": "Pólizas y seguros", "type": "tf", "context": "Un negocio contrata una póliza para ciertos riesgos.", "prompt": "Tener seguro elimina la necesidad de prevenir incidentes y revisar exclusiones.", "options": ["Verdadero", "Falso"], "answer": "1", "explanation": "El seguro no sustituye la prevención y su cobertura depende de condiciones, límites y exclusiones."}, {"id": 91, "  000, cobra ₡80 000 y paga ₡95 000. No hay otros movimientos.", "prompt": "Calcule el saldo final de efectivo en colones. Escriba solo dígitos.", "answer": "35000", "accepted": ["35000"], "explanation": "50 000 + 80 000 − 95 000 = ₡35 000 de saldo final."}, {"id": 96, "area": 2, "topic": "Cumplimiento de servicio", "type": "fill", "context": "De 60 solicitudes, 48 se resolvieron dentro del plazo acordado.", "prompt": "Calcule el porcentaje de cumplimiento. Escriba solo el número.", "answer": "80", "accepted": ["80"], "explanation": "48 ÷ 60 × 100 = 80 % de cumplimiento del plazo acordado."}, {"id": 97, "area": 2, "topic": "Control de calidad", "type": "fill", "context": "De 250 unidades producidas, 15 requieren reproceso.", "prompt": "Calcule el porcentaje de unidades que requieren reproceso. Escriba solo el número.", "answer": "6", "accepted": ["6"], "explanation": "15 ÷ 250 × 100 = 6 %. Este indicador ayuda a evaluar y mejorar el proceso."}, {"id": 98, "area": 2, "topic": "Fidelización", "type": "fill", "context": "De 80 clientes del período anterior, 60 vuelven a comprar en el período observado.", "prompt": "Calcule la tasa de retención de ese grupo en porcentaje. Escriba solo el número.", "answer": "75", "accepted": ["75"], "explanation": "60 ÷ 80 × 100 = 75 %. Se compara el mismo grupo, sin incluir clientes nuevos en el numerador."}, {"id": 99, "area": 2, "topic": "Utilidad operativa simplificada", "type": "fill", "context": "Para esta simulación: ingresos ₡500 000; costos variables ₡280 000; costos fijos ₡140 000. No hay otros costos ni impuestos en el ejercicio.", "prompt": "Calcule la utilidad operativa simplificada en colones. Escriba solo dígitos.", "answer": "80000", "accepted": ["80000"], "explanation": "500 000 − 280 000 − 140 000 = ₡80 000, bajo los supuestos expresos del ejercicio."}, {"id": 100, "area": 2, "topic": "Presupuesto de personal simulado", "type": "fill", "context": "En este ejercicio ficticio, el salario base es ₡300 000 y se presupuestan const $=s=>document.querySelector(s), root=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase().replace(/\s+/g,' ');
const correct=(q,v)=>typeof v==='string'&&(q.accepted||[q.answer]).some(a=>norm(a)===norm(v));
const grade=a=>QUESTIONS.reduce((n,q)=>n+Number(correct(q,a[q.id])),0);
const count=a=>QUESTIONS.filter(q=>String(a[q.id]??'').trim()).length;
const date=v=>new Date(v).toLocaleString('es-CR',{timeZone:'America/Costa_Rica',dateStyle:'short',timeStyle:'short'});
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
let db={version:1,students:{},attempts:[]}, user=null, screen='login',pos=0,selectedReport=null,errorsOnly=true,storageOK=true, saveMessage='',filterGroup='',filterText='';

let syncTimer=null;
function payload(a){const st=db.students[a.studentId],done=a.status==='completed',ar=AREAS.map((_,i)=>QUESTIONS.filter(q=>q.area===i&&correct(q,a.answers[q.id])).length);let resp=done?JSON.stringify(a.answers):'';if(resp.length>11000)resp='';return {action:'save',intento:a.id,cedula:st.id,nombre:st.first,apellidos:st.last,seccion:st.group,estado:a.status,respondidas:count(a.answers),nota:done?a.score:'',inicio:a.started,actualizado:a.updated,finalizado:a.completed||'',area1:ar[0]||0,area2:ar[1]||0,area3:ar[2]||0,aciertos:QUESTIONS.map(q=>correct(q,a.answers[q.id])?1:0).join(''),respuestas:resp};}
function syncNow(a){if(!SYNC_URL||!a||!db.students[a.studentId])return;clearTimeout(syncTimer);syncTimer=null;a.dirty=true;try{fetch(SYNC_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload(a))}).then(()=>{a.dirty=false;try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}}).catch(()=>{});}catch(e){}}

 const groups=[...new Set(dashRows().map(a=>String(a.seccion)))].sort();
 return `<div class="between"><div><div class="eyebrow">Panel docente</div><h1 style="margin-bottom:6px">Resultados del simulacro</h1><small>Actualizado ${esc(date(dash.when))}</small></div><div class="actions">${btn(dash.loading?'Actualizando…':'Actualizar','dash-load')}${btn('Salir','dash-out')}</div></div>
 <section class="card" style="margin-top:20px"><div class="fields"><label>Buscar por nombre o cédula<input id="teacher-search" value="${esc(filterText)}"></label><label>Sección<select id="teacher-group"><option value="">Todas</option>${groups.map(g=>`<option ${g===filterGroup?'selected':''}>${esc(g)}</option>`).join('')}</select></label><label>Nota mínima para aprobar<input id="dash-pass" type="number" min="1" max="100" value="${pass}"></label></div><div class="actions">${btn('Aplicar','dash-apply')}${btn('Descargar CSV','dash-csv')}</div></section>
 <div class="metrics"><div class="card metric"><small>Estudiantes registrados</small><strong>${list.length}</strong></div><div class="card metric"><small>Terminaron</small><strong>${withDone.length}</strong></div><div class="card metric"><small>En progreso</small><strong>${inprog.length}</strong></div><div class="card metric"><small>Aprueban (≥ ${pass})</small><strong>${passed.length}</strong><small>${withDone.length?Math.round(passed.length/withDone.length*100)+' % de quienes terminaron':'—'}</small></div><div class="card metric"><small>Nota promedio (mejor intento)</small><strong>${avg??'—'}</strong></div></div>
 <div class="metrics">${AREAS.map((n,i)=>`<section class="card metric"><h3>${esc(n)}</h3><strong>${areaPct[i]===null?'—':areaPct[i]+'%'}</strong><small>promedio de aciertos</small></section>`).join('')}</div>
 <section class="card tablewrap"><h3>Estudiantes</h3><table class="history"><thead><tr><th>Estudiante</th><th>Sección</th><th>Estado</th><th>Mejor nota</th><th>Resultado</th><th>Intentos</th><th>Última actividad</th></tr></thead><tbody>${list.map(x=>`<tr><td><b>${esc(x.name)}</b><br><small>${esc(x.id)}</small></td><td>${esc(x.group)}</td><td>${x.act?'En progreso: '+x.act.respondidas+'/100':x.done?'Terminó':'—'}</td><td class="score">${x.best===null?'—':x.best+'/100'}</td><td>${x.best===null?'Pendiente':x.best>=pass?'Aprueba':'No aprueba'}</td><td>${x.intentos}</td><td>${esc(date(x.last))}</td></tr>`).join('')}</tbody></table>${list.length?'':'<p class="empty">Aún no hay estudiantes o no hay coincidencias.</p>'}</section>
 <section class="card tablewrap"><h3>Las 10 preguntas con menos aciertos</h3><p class="muted">Para decidir qué reforzar en clase (calculado con los intentos terminados).</p><table class="history"><thead><tr><th>#</th><th>Tema</th><th>Aciertos</th></tr></thead><tbody>${qs.map(x=>`<tr><td>${x.q.id}</td><td>${esc(x.q.topic)}</td><td class="score">${x.pct} %</td></tr>`).join('')}</tbody></table>${qs.length?'':'<p class="empty">Aparecerá cuando haya intentos terminados.</p>'}</section>`;}
async function dashLoad(){dash.loading=true;dash.err='';render();try{const res=await fetch(SYNC_URL+'?action=list&key='+encodeURIComponent(dash.key),{cache:'no-store'});const j=await res.json();if(!j.ok){dash.err=j.error==='clave'?'Clave incorrecta.':'No se pudo leer la información.';dash.rows=null;}else{dash.rows=j;dash.when=Date.now();}}catch(e){dash.err='No se pudo conectar. Revisá tu conexión e intentá de nuevo.';dash.rows=null;}dash.loading=false;render();}
function dashCsv(){const {list}=dashData(),pass=Number(dash.pass)||70,cell=v=>'"'+String(v).replace(/^[=+@-]/,"'").replace(/"/g,'""')+'"';const rows=[['Cedula','Nombre','Seccion','Estado','Respondidas','Mejor nota','Resultado','Intentos'],...list.map(x=>[x.id,x.name,x.group,x.act?'En progreso':x.done?'Terminó':'',x.act?x.act.respondidas:'',x.best??'',x.best===null?'Pendiente':x.best>=pass?'Aprueba':'No aprueba',x.intentos])];download('resultados-simulacro.csv','﻿'+rows.map(r=>r.map(cell).join(';')).join('\r\n'),'text/csv;charset=utf-8');}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(a==='dash-load'){const k=$('#dash-key');if(k)dash.key=k.value;if(!dash.key){dash.err='Ingresá la clave.';render();return;}dashLoad();}if(a==='dash-out'){dash.key='';dash.rows=null;go('login');}if(a==='dash-apply'){filterText=$('#teacher-search').value;filterGroup=$('#teacher-group').value;dash.pass=$('#dash-pass').value;render();}if(a==='dash-csv'){dash.pass=$('#dash-pass').value;dashCsv();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='dash-key'){dash.key=e.target.value;dashLoad();}});

render();
</script></body></html>
